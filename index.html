  function getActiveSheet() {
    return state.blueprints.find(s => s.id === state.activeSheetId) || state.blueprints[0] || null;
  }

  function getSheetHistory(sheetId) {
    if (!sheetId) return { undo: [], redo: [] };
    if (!state.bpHistories[sheetId]) state.bpHistories[sheetId] = { undo: [], redo: [] };
    return state.bpHistories[sheetId];
  }

  function resetBpHistories() {
    state.bpHistories = Object.create(null);
    state.bpSheetHist = { undo: [], redo: [] };
    state.bpHistorySeq = 0;
  }

  function recordBpShapeHistory(sh, snap) {
    const hist = getSheetHistory(sh.id);
    hist.undo.push({ seq: ++state.bpHistorySeq, snap });
    if (hist.undo.length > 40) hist.undo.shift();
    hist.redo = [];
    state.bpSheetHist.redo = [];
    updateUndoRedoButtons();
  }

  function recordBpSheetHistory(act) {
    act.seq = ++state.bpHistorySeq;
    state.bpSheetHist.undo.push(act);
    if (state.bpSheetHist.undo.length > 40) state.bpSheetHist.undo.shift();
    state.bpSheetHist.redo = [];
    return act;
  }

  function applyBpSheetAction(act, undoing) {
    const insert = (act.kind === 'deleteSheet') === undoing;
    const idx = state.blueprints.findIndex(sh => sh.id === act.sheetId);
    if (insert) {
      if (idx !== -1) return false;
      const restored = JSON.parse(act.sheetJson);
      state.blueprints.splice(Math.min(act.index, state.blueprints.length), 0, restored);
      state.activeSheetId = restored.id;
      if ((undoing ? act.refBefore : act.refAfter) === restored.id) state.refSheetId = restored.id;
    } else {
      if (idx === -1 || state.blueprints.length <= 1) return false;
      // Keep edits made on this sheet while other sheets were active.
      act.sheetJson = JSON.stringify(state.blueprints[idx]);
      act.index = idx;
      state.blueprints.splice(idx, 1);
      if (state.activeSheetId === act.sheetId) {
        const activeId = undoing ? act.activeBefore : act.activeAfter;
        state.activeSheetId = state.blueprints.some(sh => sh.id === activeId) ? activeId : state.blueprints[Math.max(0, idx - 1)].id;
      }
      if (state.refSheetId === act.sheetId) {
        const refId = undoing ? act.refBefore : act.refAfter;
        state.refSheetId = state.blueprints.some(sh => sh.id === refId) ? refId : state.blueprints[0].id;
      }
    }
    return true;
  }

  function moveBpSheetHistory(act, undoing) {
    const from = state.bpSheetHist[undoing ? 'undo' : 'redo'];
    const index = from.indexOf(act);
    if (index === -1 || !applyBpSheetAction(act, undoing)) return false;
    from.splice(index, 1);
    act.seq = ++state.bpHistorySeq;
    state.bpSheetHist[undoing ? 'redo' : 'undo'].push(act);
    state.bp.selectedShapeIds = [];
    renderAll();
    showToast(`${undoing ? '已復原' : '已重做'}：${act.label}`);
    return true;
  }

  function stepBpHistory(undoing) {
    const direction = undoing ? 'undo' : 'redo';
    const sh = getActiveSheet(), hist = getSheetHistory(sh && sh.id);
    const shapeEntry = hist[direction][hist[direction].length - 1];
    const sheetEntry = state.bpSheetHist[direction][state.bpSheetHist[direction].length - 1];
    // Sheet contents stay independent; structural changes share their ordering.
    if (shapeEntry && (!sheetEntry || shapeEntry.seq > sheetEntry.seq)) {
      hist[direction].pop();
      hist[undoing ? 'redo' : 'undo'].push({ seq: ++state.bpHistorySeq, snap: JSON.stringify(sh.shapes) });
      sh.shapes = JSON.parse(shapeEntry.snap);
      state.bp.selectedShapeIds = [];
      renderAll(); showToast(`${undoing ? '已復原' : '已重做'}「${sh.name}」`);
      return;
    }
    if (sheetEntry && moveBpSheetHistory(sheetEntry, undoing)) return;
    showToast(undoing ? '沒有可復原的步驟' : '沒有可重做的步驟');
  }

  function snapshot3D(fullProject) {
    const base = {
      scope: fullProject ? 'full' : '3d',
      projectName: state.projectName,
      kerfCm: state.kerfCm,
      pieces: state.pieces,
      selectedId: state.selectedId
    };
    if (fullProject) {
      base.customPrices = state.customPrices;
      base.blueprints = state.blueprints;
      base.activeSheetId = state.activeSheetId;
      base.refSheetId = state.refSheetId;
    }
    return JSON.stringify(base);
  }

  function pushHistory3D(label, fullProject) {
    state.history3D.undo.push({ label: label || '編輯結構', scope: fullProject ? 'full' : '3d', snap: snapshot3D(fullProject) });
    if (state.history3D.undo.length > state.history3D.max) state.history3D.undo.shift();
    state.history3D.redo = [];
    updateUndoRedoButtons();
  }

  function applyProjectSnapshot(data) {
    state.projectName = data.projectName;
    state.kerfCm = data.kerfCm;
    state.pieces = data.pieces;
    state.selectedId = data.selectedId;
    if (data.scope === 'full') {
      if (data.customPrices) state.customPrices = data.customPrices;
      if (Array.isArray(data.blueprints) && data.blueprints.length) {
        state.blueprints = data.blueprints;
        state.activeSheetId = data.activeSheetId || state.blueprints[0].id;
        state.refSheetId = data.refSheetId || state.blueprints[0].id;
        state.bp.selectedShapeIds = [];
        resetBpHistories();
      }
    }
  }

  function undo3D() {
    if (!state.history3D.undo.length) { showToast('沒有可復原的操作'); return; }
    const entry = state.history3D.undo.pop();
    const isFull = entry.scope === 'full';
    state.history3D.redo.push({ label: entry.label, scope: entry.scope || '3d', snap: snapshot3D(isFull) });
    applyProjectSnapshot(JSON.parse(entry.snap));
    renderAll();
    showToast(`已復原：${entry.label}`);
  }

  function redo3D() {
    if (!state.history3D.redo.length) { showToast('沒有可重做的操作'); return; }
    const entry = state.history3D.redo.pop();
    const isFull = entry.scope === 'full';
    state.history3D.undo.push({ label: entry.label, scope: entry.scope || '3d', snap: snapshot3D(isFull) });
    applyProjectSnapshot(JSON.parse(entry.snap));
    renderAll();
    showToast(`已重做：${entry.label}`);
  }

  function updateUndoRedoButtons() {
    const u3 = document.getElementById('btnUndo3D');
    const r3 = document.getElementById('btnRedo3D');
    if (u3) {
      const n = state.history3D.undo.length;
      u3.disabled = n === 0;
      u3.textContent = n ? `↩ 復原 (${n})` : '↩ 復原';
      u3.title = n ? `復原：${state.history3D.undo[n - 1].label} (Ctrl+Z)` : '復原 (Ctrl+Z)';
    }
    if (r3) {
      const n = state.history3D.redo.length;
      r3.disabled = n === 0;
      r3.textContent = n ? `↪ 重做 (${n})` : '↪ 重做';
      r3.title = n ? `重做：${state.history3D.redo[n - 1].label} (Ctrl+Y)` : '重做 (Ctrl+Y)';
    }
    const sh = getActiveSheet();
    const shHist = getSheetHistory(sh && sh.id);
    const bpUndoTotal = shHist.undo.length + state.bpSheetHist.undo.length;
    const bpRedoTotal = shHist.redo.length + state.bpSheetHist.redo.length;
    const ub = document.getElementById('btnBpUndo');
    const rb = document.getElementById('btnBpRedo');
    if (ub) {
      ub.disabled = bpUndoTotal === 0;
      ub.textContent = bpUndoTotal ? `復原 (${bpUndoTotal})` : '復原';
    }
    if (rb) {
      rb.disabled = bpRedoTotal === 0;
      rb.textContent = bpRedoTotal ? `重做 (${bpRedoTotal})` : '重做';
    }
  }

  function getPrice(matId) {
    if (typeof state.customPrices[matId] === 'number' && !isNaN(state.customPrices[matId])) return state.customPrices[matId];
    return MAT_MAP[matId] ? MAT_MAP[matId].defaultPrice : 0;
  }

  function setSaveStatus(ok, msg) {
    const el = document.getElementById('saveStatusPill');
    if (!el) return;
    el.textContent = msg || (ok ? '已儲存' : '儲存失敗');
    el.classList.toggle('err', !ok);
  }

  function saveToLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        savedOnce: true,
        projectName: state.projectName, kerfCm: state.kerfCm,
        pieces: state.pieces, customPrices: state.customPrices, blueprints: state.blueprints,
        activeSheetId: state.activeSheetId, refSheetId: state.refSheetId
      }));
      setSaveStatus(true, '已儲存');
    } catch (e) {
      setSaveStatus(false, '儲存失敗');
    }
  }

  function loadInitialState() {
    let loaded = null;
    let readFailed = false;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const project = validateImportPayload(JSON.parse(raw), '木工結構專案');
        if (typeof project === 'string') readFailed = true;
        else loaded = project;
      }
    } catch {
      readFailed = true;
    }
    if (loaded) {
      applyValidatedProject(loaded);
    } else {
      const tpl = createTemplate('square_frame');
      state.projectName = tpl.projectName; state.pieces = tpl.pieces;
    }
    if (!state.blueprints.length) state.blueprints = [createDefaultBlueprint()];
    state.selectedId = state.pieces.length ? state.pieces[0].id : null;
    state.activeSheetId ||= state.blueprints[0].id;
    state.refSheetId ||= state.blueprints[0].id;
    return !readFailed;
  }

  /* =========================================================================
     4. 3D 幾何與碰撞偵測引擎 (AABB + MTV + Face-Snap)
     ========================================================================= */
  const COLLISION_EPS = 0.05;

  function getPieceDims(p) {
    const m = MAT_MAP[p.materialId];
    if (!m) return { dx: 10, dy: 10, dz: 10 };
    const L = Math.max(0.5, Number(p.cutL) || 10);
    if (m.category === 'batten') {
      const a = p.flipSection ? m.thick : m.stockW;
      const b = p.flipSection ? m.stockW : m.thick;
      if (p.orientation === 'X') return { dx: L, dy: a, dz: b };
      if (p.orientation === 'Y') return { dx: a, dy: L, dz: b };
      return { dx: a, dy: b, dz: L };
    } else {
      const W = Math.max(0.5, Number(p.cutW) || 10);
      const T = m.thick;
      const a = p.flipSection ? W : L, b = p.flipSection ? L : W;
      if (p.orientation === 'XY') return { dx: a, dy: b, dz: T };
      if (p.orientation === 'XZ') return { dx: a, dy: T, dz: b };
      return { dx: T, dy: a, dz: b };
    }
  }

  function getPieceBox(p) {
    const d = getPieceDims(p);
    return { x0: p.x, x1: p.x + d.dx, y0: p.y, y1: p.y + d.dy, z0: p.z, z1: p.z + d.dz, dx: d.dx, dy: d.dy, dz: d.dz };
  }

  function checkBoxOverlap(a, b) {
    const ox0 = Math.max(a.x0, b.x0), ox1 = Math.min(a.x1, b.x1);
    const oy0 = Math.max(a.y0, b.y0), oy1 = Math.min(a.y1, b.y1);
    const oz0 = Math.max(a.z0, b.z0), oz1 = Math.min(a.z1, b.z1);
    const ox = ox1 - ox0, oy = oy1 - oy0, oz = oz1 - oz0;
    if (ox > COLLISION_EPS && oy > COLLISION_EPS && oz > COLLISION_EPS) {
      const acx = (a.x0 + a.x1) / 2, bcx = (b.x0 + b.x1) / 2;
      const acy = (a.y0 + a.y1) / 2, bcy = (b.y0 + b.y1) / 2;
      const acz = (a.z0 + a.z1) / 2, bcz = (b.z0 + b.z1) / 2;
      const moves = [
        { axis: 'x', delta: acx < bcx ? -(a.x1 - b.x0) : (b.x1 - a.x0), dist: ox },
        { axis: 'y', delta: acy < bcy ? -(a.y1 - b.y0) : (b.y1 - a.y0), dist: oy },
        { axis: 'z', delta: acz < bcz ? -(a.z1 - b.z0) : (b.z1 - a.z0), dist: oz }
      ].sort((u, v) => Math.abs(u.delta) - Math.abs(v.delta));
      return { ox0, ox1, oy0, oy1, oz0, oz1, depth: Math.min(ox, oy, oz), mtv: moves[0] };
    }
    return null;
  }

  function detectAllCollisions() {
    const pairs = [], collidingIds = new Set();
    const boxes = state.pieces.map(p => ({ p, box: getPieceBox(p) }));
    for (let i = 0; i < boxes.length; i++) {
      for (let j = i + 1; j < boxes.length; j++) {
        const ov = checkBoxOverlap(boxes[i].box, boxes[j].box);
        if (ov) { collidingIds.add(boxes[i].p.id); collidingIds.add(boxes[j].p.id); pairs.push({ a: boxes[i].p, b: boxes[j].p, ov }); }
      }
    }
    return { pairs, collidingIds };
  }

  function pieceCollidesWithAny(candidatePiece, ignoreId) {
    const box = getPieceBox(candidatePiece);
    for (const other of state.pieces) {
      if (other.id === ignoreId) continue;
      const ov = checkBoxOverlap(box, getPieceBox(other));
      if (ov) return { other, ov };
    }
    return null;
  }

  function findNonCollidingPlacement(piece, refPiece) {
    const d = getPieceDims(piece);
    const candidates = [];
    if (refPiece) {
      const rb = getPieceBox(refPiece);
      candidates.push(
        { x: rb.x1, y: rb.y0, z: rb.z0 }, { x: rb.x0, y: rb.y0, z: rb.z1 },
        { x: rb.x0, y: rb.y1, z: rb.z0 }, { x: rb.x0 - d.dx, y: rb.y0, z: rb.z0 }
      );
    }
    const bounds = getOverallBounds();
    candidates.push(
      { x: state.pieces.length ? bounds.maxX + 2 : 0, y: 0, z: 0 },
      { x: 0, y: state.pieces.length ? bounds.maxY + 2 : 0, z: 0 },
      { x: 0, y: 0, z: state.pieces.length ? bounds.maxZ : 0 }
    );
    for (const c of candidates) {
      const test = Object.assign({}, piece, { x: Number(c.x.toFixed(1)), y: Number(c.y.toFixed(1)), z: Math.max(0, Number(c.z.toFixed(1))) });
      if (!pieceCollidesWithAny(test, piece.id)) return { x: test.x, y: test.y, z: test.z };
    }
    return { x: Number((bounds.maxX + 4).toFixed(1)), y: 0, z: 0 };
  }

  function movePieceWithCollisionGuard(piece, axis, delta) {
    const targetVal = Number((piece[axis] + delta).toFixed(2));
    if (state.collisionMode !== 'prevent') { piece[axis] = targetVal; return { snapped: false }; }
    const oldVal = piece[axis];
    const hit = pieceCollidesWithAny(Object.assign({}, piece, { [axis]: targetVal }), piece.id);
    if (!hit) { piece[axis] = targetVal; return { snapped: false }; }
    const ob = getPieceBox(hit.other), d = getPieceDims(piece);
    const dimKey = axis === 'x' ? 'dx' : (axis === 'y' ? 'dy' : 'dz');
    const snappedVal = delta > 0 ? Number((ob[axis + '0'] - d[dimKey]).toFixed(2)) : Number((ob[axis + '1']).toFixed(2));
    if (!pieceCollidesWithAny(Object.assign({}, piece, { [axis]: snappedVal }), piece.id)) {
      piece[axis] = snappedVal; return { snapped: true, targetName: hit.other.name };
    }
    piece[axis] = oldVal; return { snapped: true, blocked: true, targetName: hit.other.name };
  }

  function resolveCollisionsForPiece(pieceId) {
    const p = state.pieces.find(x => x.id === pieceId); if (!p) return 0;
    let moved = 0;
    for (let iter = 0; iter < 8; iter++) {
      const hit = pieceCollidesWithAny(p, p.id); if (!hit) break;
      const cands = getCandidateSeparations(p, hit.other);
      let chosen = null;
      for (const c of cands) {
        const test = Object.assign({}, p, { [c.axis]: Number((p[c.axis] + c.delta).toFixed(2)) });
        if (!pieceCollidesWithAny(test, p.id)) { chosen = c; break; }
      }
      if (!chosen && cands.length) chosen = cands[0];
      if (!chosen) break;
      p[chosen.axis] = Number((p[chosen.axis] + chosen.delta).toFixed(2));
      if (p.z < 0) p.z = 0;
      moved++;
    }
    return moved;
  }

  function getCandidateSeparations(mover, obstacle) {
    const a = getPieceBox(mover), b = getPieceBox(obstacle);
    const cands = [
      { axis: 'x', delta: b.x1 - a.x0 },
      { axis: 'x', delta: -(a.x1 - b.x0) },
      { axis: 'y', delta: b.y1 - a.y0 },
      { axis: 'y', delta: -(a.y1 - b.y0) },
      { axis: 'z', delta: b.z1 - a.z0 },
      { axis: 'z', delta: -(a.z1 - b.z0) }
    ];
    return cands
      .filter(c => !(c.axis === 'z' && mover.z + c.delta < -0.01))
      .sort((u, v) => Math.abs(u.delta) - Math.abs(v.delta));
  }

  function resolveAllCollisions() {
    const before = detectAllCollisions().pairs.length;
    let movedCount = 0;
    for (let pass = 0; pass < 10; pass++) {
      const { pairs } = detectAllCollisions();
      if (!pairs.length) break;
      let progress = false;
      for (const pair of pairs) {
        if (!checkBoxOverlap(getPieceBox(pair.a), getPieceBox(pair.b))) continue;
        // Try moving pair.b first, then pair.a, picking smallest valid move that stays Z >= 0
        const tries = [
          ...getCandidateSeparations(pair.b, pair.a).map(c => ({ target: pair.b, other: pair.a, ...c })),
          ...getCandidateSeparations(pair.a, pair.b).map(c => ({ target: pair.a, other: pair.b, ...c }))
        ].sort((u, v) => Math.abs(u.delta) - Math.abs(v.delta));

        let chosen = null;
        for (const tr of tries) {
          const nextPos = Number((tr.target[tr.axis] + tr.delta).toFixed(2));
          const test = Object.assign({}, tr.target, { [tr.axis]: nextPos });
          if (!pieceCollidesWithAny(test, tr.target.id)) { chosen = tr; break; }
        }
        if (!chosen && tries.length) chosen = tries[0];
        if (chosen) {
          chosen.target[chosen.axis] = Number((chosen.target[chosen.axis] + chosen.delta).toFixed(2));
          if (chosen.target.z < 0) chosen.target.z = 0;
          movedCount++;
          progress = true;
        }
      }
      if (!progress) break;
    }
    const after = detectAllCollisions().pairs.length;
    return { before, after, movedCount };
  }

  function snapPieceToReference(piece, refPiece, dir) {
    const d = getPieceDims(piece), rb = getPieceBox(refPiece);
    if (dir === 'right') piece.x = Number(rb.x1.toFixed(2));
    else if (dir === 'left') piece.x = Number((rb.x0 - d.dx).toFixed(2));
    else if (dir === 'back') piece.y = Number(rb.y1.toFixed(2));
    else if (dir === 'front') piece.y = Number((rb.y0 - d.dy).toFixed(2));
    else if (dir === 'top') piece.z = Number(rb.z1.toFixed(2));
    else if (dir === 'bottom') piece.z = Number((rb.z0 - d.dz).toFixed(2));
  }

  function getOverallBounds() {
    if (!state.pieces.length) return { minX: 0, maxX: 60, minY: 0, maxY: 60, minZ: 0, maxZ: 60, cx: 30, cy: 30, cz: 30, sizeX: 0, sizeY: 0, sizeZ: 0 };
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (const p of state.pieces) {
      const d = getPieceDims(p);
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x + d.dx);
      minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y + d.dy);
      minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z + d.dz);
    }
    return { minX, maxX, minY, maxY, minZ, maxZ, cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, cz: (minZ + maxZ) / 2, sizeX: maxX - minX, sizeY: maxY - minY, sizeZ: maxZ - minZ };
  }

  /* =========================================================================
     5. 1D 角材 & 2D 板材最佳化裁切估算 (BOM Optimizer)
     ========================================================================= */
  function computeBOM() {
    const kerf = Math.max(0, Number(state.kerfCm) || 0);
    const groups = new Map(), excludedPieces = [], cutPieces = [];
    let totalCuts = 0;
    const joinerySummary = Object.create(null);
    for (const p of state.pieces) {
      const m = MAT_MAP[p.materialId]; if (!m) continue;
      const l = Math.max(0.5, Number(p.cutL) || 0);
      const w = Math.max(0.5, Number(p.cutW) || 0);
      const item = { id: p.id, name: p.name, l, w, area: l * w, material: m };
      const fits = m.category === 'batten'
        ? l <= m.stockL
        : (l <= m.stockL && w <= m.stockW) || (w <= m.stockL && l <= m.stockW);
      if (!fits) {
        excludedPieces.push(item);
        continue;
      }
      cutPieces.push(item);
      if (!groups.has(m.id)) groups.set(m.id, { material: m, items: [] });
      groups.get(m.id).items.push(item);
      const jId = p.joinery || 'none';
      if (!joinerySummary[jId]) joinerySummary[jId] = { count: 0, points: 0 };
      joinerySummary[jId].count += 1;
      joinerySummary[jId].points += (JOINERY_MAP[jId] ? JOINERY_MAP[jId].pointsPerPiece : 0);
    }

    const battenPlans = [], sheetPlans = [], summaryRows = []; let grandTotalCost = 0;
    for (const { material: m, items } of groups.values()) {
      const unitPrice = getPrice(m.id);
      if (m.category === 'batten') {
        const cuts = items.slice().sort((a, b) => b.l - a.l);
        const bins = [];
        for (const it of cuts) {
          let placed = false;
          for (const bin of bins) {
            const need = bin.used > 0 ? it.l + kerf : it.l;
            if (bin.used + need <= m.stockL + 0.001) { bin.cuts.push(it); bin.used += need; placed = true; break; }
          }
          if (!placed) bins.push({ cuts: [it], used: it.l });
        }
        for (const bin of bins) {
          const rem = m.stockL - bin.used;
          if (bin.cuts.length === 1) totalCuts += (rem > 0.05 ? 1 : 0);
          else totalCuts += (bin.cuts.length - 1) + (rem > 0.05 ? 1 : 0);
        }
        const utilPct = Math.min(100, 100 * items.reduce((s, i) => s + i.l, 0) / (bins.length * m.stockL));
        const subtotal = bins.length * unitPrice; grandTotalCost += subtotal;
        battenPlans.push({ material: m, bins, utilPct, subtotal, unitPrice });
        summaryRows.push({ material: m, qty: bins.length, utilPct, unitPrice, subtotal });
      } else {
        const cuts = items.slice().sort((a, b) => Math.max(b.l, b.w) - Math.max(a.l, a.w) || b.area - a.area);
        const sheets = [];
        for (const it of cuts) {
          let placed = false;
          for (const sheet of sheets) {
            for (const shelf of sheet.shelves) {
              for (const o of [{ rw: it.l, rh: it.w, rot: false }, { rw: it.w, rh: it.l, rot: true }]) {
                const needX = shelf.x > 0 ? o.rw + kerf : o.rw;
                if (o.rh <= shelf.h + 0.001 && shelf.x + needX <= m.stockL + 0.001) {
                  const px = shelf.x > 0 ? shelf.x + kerf : 0;
                  sheet.rects.push({ x: px, y: shelf.y, w: o.rw, h: o.rh, name: it.name, id: it.id, rot: o.rot });
                  shelf.x = px + o.rw; placed = true; break;
                }
              }
              if (placed) break;
            }
            if (placed) break;
            const nextY = sheet.usedY > 0 ? sheet.usedY + kerf : 0;
            const cands = [{ rw: it.l, rh: it.w, rot: false }, { rw: it.w, rh: it.l, rot: true }]
              .filter(o => o.rw <= m.stockL + 0.001 && nextY + o.rh <= m.stockW + 0.001).sort((a, b) => a.rh - b.rh);
            if (cands.length) {
              const best = cands[0];
              sheet.shelves.push({ y: nextY, h: best.rh, x: best.rw }); sheet.usedY = nextY + best.rh;
              sheet.rects.push({ x: 0, y: nextY, w: best.rw, h: best.rh, name: it.name, id: it.id, rot: best.rot });
              placed = true; break;
            }
          }
          if (!placed) {
            let rw = it.l, rh = it.w, rot = false;
            if ((rw > m.stockL || rh > m.stockW) && it.w <= m.stockL && it.l <= m.stockW) { rw = it.w; rh = it.l; rot = true; }
            else if (it.w <= m.stockL && it.l <= m.stockW && it.l < it.w) { rw = it.w; rh = it.l; rot = true; }
            sheets.push({ usedY: rh, shelves: [{ y: 0, h: rh, x: rw }], rects: [{ x: 0, y: 0, w: rw, h: rh, name: it.name, id: it.id, rot }] });
          }
        }
        for (const sheet of sheets) {
          if (sheet.rects.length === 1 && Math.abs(sheet.rects[0].w - m.stockL) <= 0.1 && Math.abs(sheet.rects[0].h - m.stockW) <= 0.1) continue;
          for (const shf of sheet.shelves) {
            if (shf.y + shf.h < m.stockW - 0.1) totalCuts += 1;
            const rowRects = sheet.rects.filter(r => Math.abs(r.y - shf.y) < 0.05);
            if (rowRects.length === 1) { if (rowRects[0].w < m.stockL - 0.1) totalCuts += 1; }
            else if (rowRects.length > 1) totalCuts += (rowRects.length - 1) + (shf.x < m.stockL - 0.1 ? 1 : 0);
            for (const rr of rowRects) { if (rr.h < shf.h - 0.1) totalCuts += 1; }
          }
        }
        const utilPct = Math.min(100, 100 * items.reduce((s, i) => s + i.area, 0) / (sheets.length * m.stockL * m.stockW));
        const subtotal = sheets.length * unitPrice; grandTotalCost += subtotal;
        sheetPlans.push({ material: m, sheets, utilPct, subtotal, unitPrice });
        summaryRows.push({ material: m, qty: sheets.length, utilPct, unitPrice, subtotal });
      }
    }
    return { battenPlans, sheetPlans, summaryRows, grandTotalCost, totalCuts, joinerySummary, cutPieces, excludedPieces };
  }

  function formatCutSize(material, length, width) {
    return material.category === 'batten' ? length + ' cm' : length + ' × ' + width + ' cm';
  }

  function describeExcludedCut({ name, l, w, material }) {
    const cut = formatCutSize(material, l, w);
    const stock = formatCutSize(material, material.stockL, material.stockW);
    return `${name}｜${material.name}｜構件 ${cut}，原料 ${stock}`;
  }

  /* =========================================================================
     6. 3D 渲染引擎
     ========================================================================= */
  const canvas = document.getElementById('sceneCanvas');
  const ctx = canvas.getContext('2d');
  let hitPolygons = [];

  const splitBpCanvas = document.getElementById('splitBpCanvas');
  const splitBpCtx = splitBpCanvas.getContext('2d');
  const split3DCanvas = document.getElementById('split3DCanvas');
  const split3DCtx = split3DCanvas.getContext('2d');
  let splitHitPolygons = [];

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (state.activePage === '3d') {
      const wrap = document.getElementById('canvasWrap');
      const rect = wrap.getBoundingClientRect();
      canvas.width = Math.max(100, Math.floor(rect.width * dpr));
      canvas.height = Math.max(100, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      renderScene();
      if (state.showRefDrawer) renderRefCanvas();
    } else if (state.activePage === 'blueprint') {
      resizeBpCanvas();
    } else if (state.activePage === 'split') {
      const bpWrap = document.getElementById('splitBpWrap'), bpRect = bpWrap.getBoundingClientRect();
      if (bpRect.width > 10 && bpRect.height > 10) {
        splitBpCanvas.width = Math.floor(bpRect.width * dpr);
        splitBpCanvas.height = Math.floor(bpRect.height * dpr);
        splitBpCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      const d3Wrap = document.getElementById('split3DWrap'), d3Rect = d3Wrap.getBoundingClientRect();
      if (d3Rect.width > 10 && d3Rect.height > 10) {
        split3DCanvas.width = Math.floor(d3Rect.width * dpr);
        split3DCanvas.height = Math.floor(d3Rect.height * dpr);
        split3DCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      renderSplitViews();
    }
  }

  function projectPoint(px, py, pz, bounds, w, h) {
    const cam = state.camera;
    const x = px - bounds.cx, y = py - bounds.cy, z = pz - bounds.cz;
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    const x1 = x * cy - y * sy, y1 = x * sy + y * cy;
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const y2 = y1 * cp - z * sp, z2 = y1 * sp + z * cp;
    const maxSpan = Math.max(bounds.sizeX, bounds.sizeY, bounds.sizeZ, 60);
    const scale = ((Math.min(w, h) * 0.44) / maxSpan) * cam.zoom;
    const dist = maxSpan * 4.2;
    const persp = dist / Math.max(10, dist + y2);
    return { sx: w / 2 + cam.panX + x1 * scale * persp, sy: h / 2 + 20 + cam.panY - z2 * scale * persp, depth: y2 };
  }

  function renderScene() {
    const wrap = document.getElementById('canvasWrap');
    renderSceneOnContext(ctx, wrap.clientWidth || 800, wrap.clientHeight || 600, hitPolygons, false);
  }

  function renderSceneOnContext(c, w, h, outHits, showSectionPlane) {
    c.clearRect(0, 0, w, h);

    const bounds = getOverallBounds();
    const { pairs: collisionPairs, collidingIds } = detectAllCollisions();
    outHits.length = 0;

    const cBadge = document.getElementById('collisionBadge');
    const cSep = document.getElementById('collisionSep');
    if (collisionPairs.length === 0) {
      cBadge.style.display = 'none';
      if (cSep) cSep.style.display = 'none';
    } else {
      cBadge.style.display = 'inline-flex';
      if (cSep) cSep.style.display = 'inline-block';
      cBadge.className = 'pill-status pill-danger';
      cBadge.innerHTML = `⚠ ${collisionPairs.length} 處碰撞 <button id="btnAutoFixAll" class="btn btn-xs btn-danger" type="button" style="margin-left:3px;padding:1px 6px;">一鍵退讓解碰</button>`;
    }

    const bboxEl = document.getElementById('bboxReadout');
    bboxEl.textContent = state.pieces.length === 0
      ? '畫布為空'
      : `外廓：${bounds.sizeX.toFixed(1)} × ${bounds.sizeY.toFixed(1)} × ${bounds.sizeZ.toFixed(1)} cm (${(bounds.sizeX / 30.3).toFixed(2)}×${(bounds.sizeZ / 30.3).toFixed(2)}尺)`;

    // Floor Grid
    const gridSpan = Math.max(120, Math.ceil(Math.max(bounds.maxX, bounds.maxY, 80) / 20) * 20 + 20);
    const step = gridSpan > 220 ? 30 : 20;
    c.lineWidth = 1; c.strokeStyle = 'rgba(130, 118, 100, 0.14)';
    c.beginPath();
    for (let gx = -40; gx <= gridSpan; gx += step) {
      const a = projectPoint(gx, -40, 0, bounds, w, h), b = projectPoint(gx, gridSpan, 0, bounds, w, h);
      c.moveTo(a.sx, a.sy); c.lineTo(b.sx, b.sy);
    }
    for (let gy = -40; gy <= gridSpan; gy += step) {
      const a = projectPoint(-40, gy, 0, bounds, w, h), b = projectPoint(gridSpan, gy, 0, bounds, w, h);
      c.moveTo(a.sx, a.sy); c.lineTo(b.sx, b.sy);
    }
    c.stroke();

    // Axes
    const o = projectPoint(0, 0, 0, bounds, w, h);
    const axLen = Math.max(22, Math.min(45, Math.max(bounds.sizeX, bounds.sizeZ) * 0.25));
    c.font = 'bold 10px ' + getComputedStyle(document.body).fontFamily;
    for (const ax of [
      { pt: projectPoint(axLen, 0, 0, bounds, w, h), color: '#dc2626', lbl: 'X 寬' },
      { pt: projectPoint(0, axLen, 0, bounds, w, h), color: '#16a34a', lbl: 'Y 深' },
      { pt: projectPoint(0, 0, axLen, bounds, w, h), color: '#2563eb', lbl: 'Z 高' }
    ]) {
      c.beginPath(); c.strokeStyle = ax.color; c.lineWidth = 1.6;
      c.moveTo(o.sx, o.sy); c.lineTo(ax.pt.sx, ax.pt.sy); c.stroke();
      c.fillStyle = ax.color; c.fillText(ax.lbl, ax.pt.sx + 4, ax.pt.sy + 3);
    }

    const explodeFactor = (state.camera.explode || 0) / 100;
    const faces = [], fastenerPts = [], labelPts = [];

    for (const p of state.pieces) {
      const m = MAT_MAP[p.materialId]; if (!m) continue;
      const d = getPieceDims(p);
      const ex = ((p.x + d.dx / 2) - bounds.cx) * explodeFactor * 0.65;
      const ey = ((p.y + d.dy / 2) - bounds.cy) * explodeFactor * 0.65;
      const ez = ((p.z + d.dz / 2) - bounds.cz) * explodeFactor * 0.65;
      const x0 = p.x + ex, x1 = x0 + d.dx, y0 = p.y + ey, y1 = y0 + d.dy, z0 = p.z + ez, z1 = z0 + d.dz;

      const corners = [
        projectPoint(x0, y0, z0, bounds, w, h), projectPoint(x1, y0, z0, bounds, w, h),
        projectPoint(x1, y1, z0, bounds, w, h), projectPoint(x0, y1, z0, bounds, w, h),
        projectPoint(x0, y0, z1, bounds, w, h), projectPoint(x1, y0, z1, bounds, w, h),
        projectPoint(x1, y1, z1, bounds, w, h), projectPoint(x0, y1, z1, bounds, w, h)
      ];
      const isSel = p.id === state.selectedId, isCol = collidingIds.has(p.id);
      for (const bf of [
        { idx: [4, 5, 6, 7], color: m.colorTop }, { idx: [0, 3, 2, 1], color: m.colorSide },
        { idx: [0, 1, 5, 4], color: m.colorFront }, { idx: [2, 3, 7, 6], color: m.colorFront },
        { idx: [1, 2, 6, 5], color: m.colorSide }, { idx: [3, 0, 4, 7], color: m.colorSide }
      ]) {
        const pts = bf.idx.map(i => corners[i]);
        const cross = (pts[1].sx - pts[0].sx) * (pts[2].sy - pts[0].sy) - (pts[1].sy - pts[0].sy) * (pts[2].sx - pts[0].sx);
        if (!state.camera.wireframe && cross >= 0) continue;
        faces.push({ pts, depth: (pts[0].depth + pts[1].depth + pts[2].depth + pts[3].depth) / 4, color: bf.color, pieceId: p.id, isSel, isCol });
      }

      if (state.camera.showLabels) {
        const cp = projectPoint((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2, bounds, w, h);
        labelPts.push({ sx: cp.sx, sy: cp.sy, text: m.category === 'batten' ? `${p.cutL}cm` : `${p.cutL}×${p.cutW}cm`, name: p.name, isSel, isCol });
      }

      if (state.camera.showFasteners && p.joinery && p.joinery !== 'none') {
        const inset = 1.6;
        if (m.category === 'batten') {
          if (p.orientation === 'X') fastenerPts.push(projectPoint(x0 + inset, (y0 + y1) / 2, (z0 + z1) / 2, bounds, w, h), projectPoint(x1 - inset, (y0 + y1) / 2, (z0 + z1) / 2, bounds, w, h));
          else if (p.orientation === 'Y') fastenerPts.push(projectPoint((x0 + x1) / 2, y0 + inset, (z0 + z1) / 2, bounds, w, h), projectPoint((x0 + x1) / 2, y1 - inset, (z0 + z1) / 2, bounds, w, h));
          else fastenerPts.push(projectPoint((x0 + x1) / 2, (y0 + y1) / 2, z0 + inset, bounds, w, h), projectPoint((x0 + x1) / 2, (y0 + y1) / 2, z1 - inset, bounds, w, h));
        } else {
          const mx = (x0 + x1) / 2;
          if (p.orientation === 'XY') fastenerPts.push(projectPoint(x0 + 3, y0 + 3, z1, bounds, w, h), projectPoint(x1 - 3, y0 + 3, z1, bounds, w, h), projectPoint(x0 + 3, y1 - 3, z1, bounds, w, h), projectPoint(x1 - 3, y1 - 3, z1, bounds, w, h));
          else if (p.orientation === 'XZ') fastenerPts.push(projectPoint(x0 + 3, y0, z0 + 3, bounds, w, h), projectPoint(x1 - 3, y0, z0 + 3, bounds, w, h), projectPoint(x0 + 3, y0, z1 - 3, bounds, w, h), projectPoint(x1 - 3, y0, z1 - 3, bounds, w, h));
          else fastenerPts.push(projectPoint(mx, y0 + 3, z0 + 3, bounds, w, h), projectPoint(mx, y1 - 3, z1 - 3, bounds, w, h));
        }
      }
    }

    faces.sort((a, b) => b.depth - a.depth);
    for (const f of faces) {
      c.beginPath();
      c.moveTo(f.pts[0].sx, f.pts[0].sy); c.lineTo(f.pts[1].sx, f.pts[1].sy);
      c.lineTo(f.pts[2].sx, f.pts[2].sy); c.lineTo(f.pts[3].sx, f.pts[3].sy); c.closePath();
      if (state.camera.wireframe) {
        c.fillStyle = f.isCol ? 'rgba(220, 38, 38, 0.25)' : (f.isSel ? 'rgba(154, 91, 37, 0.22)' : 'rgba(255, 255, 255, 0.14)');
        c.fill(); c.strokeStyle = f.isCol ? '#dc2626' : (f.isSel ? '#9a5b25' : '#5c6570');
        c.lineWidth = (f.isSel || f.isCol) ? 2 : 1; c.stroke();
      } else {
        c.fillStyle = f.color; c.fill();
        if (f.isCol) { c.fillStyle = 'rgba(220, 38, 38, 0.22)'; c.fill(); }
        c.strokeStyle = f.isCol ? '#dc2626' : (f.isSel ? '#9a5b25' : 'rgba(55, 45, 35, 0.45)');
        c.lineWidth = (f.isSel || f.isCol) ? 2.2 : 0.9; c.stroke();
      }
      outHits.push({ pts: f.pts, pieceId: f.pieceId });
    }

    if (explodeFactor === 0 && collisionPairs.length) {
      for (const pair of collisionPairs) {
        const ov = pair.ov;
        const ovPts = [
          projectPoint(ov.ox0, ov.oy0, ov.oz0, bounds, w, h), projectPoint(ov.ox1, ov.oy0, ov.oz0, bounds, w, h),
          projectPoint(ov.ox1, ov.oy1, ov.oz0, bounds, w, h), projectPoint(ov.ox0, ov.oy1, ov.oz0, bounds, w, h),
          projectPoint(ov.ox0, ov.oy0, ov.oz1, bounds, w, h), projectPoint(ov.ox1, ov.oy0, ov.oz1, bounds, w, h),
          projectPoint(ov.ox1, ov.oy1, ov.oz1, bounds, w, h), projectPoint(ov.ox0, ov.oy1, ov.oz1, bounds, w, h)
        ];
        for (const idxs of [[4,5,6,7],[0,1,5,4],[2,3,7,6],[1,2,6,5],[3,0,4,7]]) {
          c.beginPath(); c.moveTo(ovPts[idxs[0]].sx, ovPts[idxs[0]].sy);
          for (let k = 1; k < 4; k++) c.lineTo(ovPts[idxs[k]].sx, ovPts[idxs[k]].sy);
          c.closePath(); c.fillStyle = 'rgba(220, 38, 38, 0.42)'; c.fill();
          c.strokeStyle = '#b91c1c'; c.lineWidth = 1.6; c.stroke();
        }
      }
    }


    // Translucent blue cutting plane indicator when viewing a Cross-Section sheet in Split mode
    if (showSectionPlane) {
      const activeSh = getActiveSheet();
      if (activeSh && activeSh.underlay === 'section') {
        const ax = activeSh.sectionAxis || 'Z';
        const pos = typeof activeSh.sectionPos === 'number' ? activeSh.sectionPos : 30;
        const pad = 12;
        let p4;
        if (ax === 'Z') {
          p4 = [
            projectPoint(bounds.minX - pad, bounds.minY - pad, pos, bounds, w, h),
            projectPoint(bounds.maxX + pad, bounds.minY - pad, pos, bounds, w, h),
            projectPoint(bounds.maxX + pad, bounds.maxY + pad, pos, bounds, w, h),
            projectPoint(bounds.minX - pad, bounds.maxY + pad, pos, bounds, w, h)
          ];
        } else if (ax === 'Y') {
          p4 = [
            projectPoint(bounds.minX - pad, pos, bounds.minZ - pad, bounds, w, h),
            projectPoint(bounds.maxX + pad, pos, bounds.minZ - pad, bounds, w, h),
            projectPoint(bounds.maxX + pad, pos, bounds.maxZ + pad, bounds, w, h),
            projectPoint(bounds.minX - pad, pos, bounds.maxZ + pad, bounds, w, h)
          ];
        } else {
          p4 = [
            projectPoint(pos, bounds.minY - pad, bounds.minZ - pad, bounds, w, h),
            projectPoint(pos, bounds.maxY + pad, bounds.minZ - pad, bounds, w, h),
            projectPoint(pos, bounds.maxY + pad, bounds.maxZ + pad, bounds, w, h),
            projectPoint(pos, bounds.minY - pad, bounds.maxZ + pad, bounds, w, h)
          ];
        }
        c.save();
        c.beginPath();
        c.moveTo(p4[0].sx, p4[0].sy);
        for (let k = 1; k < 4; k++) c.lineTo(p4[k].sx, p4[k].sy);
        c.closePath();
        c.fillStyle = 'rgba(37, 99, 235, 0.16)';
        c.fill();
        c.setLineDash([5, 4]);
        c.strokeStyle = '#2563eb';
        c.lineWidth = 1.6;
        c.stroke();
        c.restore();
      }
    }
    if (state.camera.showFasteners) {
      for (const fp of fastenerPts) {
        c.beginPath(); c.arc(fp.sx, fp.sy, 3.2, 0, Math.PI * 2);
        c.fillStyle = '#dc2626'; c.fill(); c.strokeStyle = '#ffffff'; c.lineWidth = 1.2; c.stroke();
      }
    }

    if (state.camera.showLabels) {
      c.font = '700 12px ui-monospace, Menlo, Consolas, monospace';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      for (const lb of labelPts) {
        const text = lb.isSel ? `${lb.name} · ${lb.text}` : lb.text;
        const tw = c.measureText(text).width + 12, th = 21;
        c.fillStyle = lb.isCol ? 'rgba(185, 28, 28, 0.94)' : (lb.isSel ? 'rgba(154, 91, 37, 0.94)' : 'rgba(255, 255, 255, 0.88)');
        c.strokeStyle = lb.isCol ? '#7f1d1d' : (lb.isSel ? '#7f491b' : 'rgba(140, 128, 110, 0.45)');
        c.lineWidth = 1;
        roundRect(c, lb.sx - tw / 2, lb.sy - th / 2, tw, th, 4);
        c.fill(); c.stroke();
        c.fillStyle = (lb.isSel || lb.isCol) ? '#ffffff' : '#1e242b';
        c.fillText(text, lb.sx, lb.sy + 0.5);
      }
      c.textAlign = 'left';
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function pointInPoly(x, y, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].sx, yi = pts[i].sy, xj = pts[j].sx, yj = pts[j].sy;
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi + 1e-9) + xi)) inside = !inside;
    }
    return inside;
  }

  /* =========================================================================
     7. 2D 滿版設計圖紙繪製引擎
     ========================================================================= */
  const bpCanvas = document.getElementById('bpCanvas');
  const bpCtx = bpCanvas.getContext('2d');
  const refCanvas = document.getElementById('refCanvas');
  const refCtx = refCanvas.getContext('2d');

  function bpWorldToScreen(wx, wy, w, h, cam) { return { sx: cam.panX + wx * cam.scale, sy: h - cam.panY - wy * cam.scale }; }
  function bpScreenToWorld(sx, sy, w, h, cam) { return { wx: (sx - cam.panX) / cam.scale, wy: (h - cam.panY - sy) / cam.scale }; }
  function snapVal(v) { const step = state.bp.snapCm; return (!step || step <= 0) ? Number(v.toFixed(1)) : Number((Math.round(v / step) * step).toFixed(2)); }

  function pushBpUndo() {
    const sh = getActiveSheet(); if (!sh) return;
    recordBpShapeHistory(sh, JSON.stringify(sh.shapes));
  }

  function get3DSectionData(axis, pos) {
    const cutRects = [], bgRects = [];
    for (const p of state.pieces) {
      const b = getPieceBox(p);
      let isCut = false, r;
      if (axis === 'Z') {
        isCut = pos >= b.z0 - 0.05 && pos <= b.z1 + 0.05;
        r = { x: b.x0, y: b.y0, w: b.dx, h: b.dy, name: p.name, materialId: p.materialId };
      } else if (axis === 'Y') {
        isCut = pos >= b.y0 - 0.05 && pos <= b.y1 + 0.05;
        r = { x: b.x0, y: b.z0, w: b.dx, h: b.dz, name: p.name, materialId: p.materialId };
      } else {
        isCut = pos >= b.x0 - 0.05 && pos <= b.x1 + 0.05;
        r = { x: b.y0, y: b.z0, w: b.dy, h: b.dz, name: p.name, materialId: p.materialId };
      }
      if (isCut) cutRects.push(r);
      else bgRects.push(r);
    }
    return { cutRects, bgRects };
  }

  function drawHatchRect(c, sx, sy, pw, ph, color) {
    c.save();
    c.beginPath();
    c.rect(sx, sy, pw, ph);
    c.clip();
    c.strokeStyle = color || 'rgba(154, 91, 37, 0.55)';
    c.lineWidth = 1;
    const step = 6;
    c.beginPath();
    for (let d = -ph; d < pw + ph; d += step) {
      c.moveTo(sx + d, sy);
      c.lineTo(sx + d - ph, sy + ph);
    }
    c.stroke();
    c.restore();
  }

  function get3DUnderlayRects(mode) {
    if (!mode || mode === 'none') return [];
    return state.pieces.map(p => {
      const b = getPieceBox(p);
      if (mode === 'front') return { x: b.x0, y: b.z0, w: b.dx, h: b.dz, name: p.name };
      if (mode === 'top') return { x: b.x0, y: b.y0, w: b.dx, h: b.dy, name: p.name };
      return { x: b.y0, y: b.z0, w: b.dy, h: b.dz, name: p.name };
    });
  }

  function drawBlueprintOnContext(c, w, h, sheet, cam, opts) {
    c.clearRect(0, 0, w, h);
    if (opts && opts.background) { c.fillStyle = opts.background; c.fillRect(0, 0, w, h); }
    if (!sheet) return;
    const interactive = opts && opts.interactive;

    const minW = bpScreenToWorld(0, h, w, h, cam), maxW = bpScreenToWorld(w, 0, w, h, cam);
    const minorStep = cam.scale >= 3.2 ? 1 : 5, majorStep = 10;
    c.lineWidth = 1;
    if (cam.scale >= 1.8) {
      c.strokeStyle = 'rgba(37, 99, 235, 0.05)';
      c.beginPath();
      for (let gx = Math.floor(minW.wx / minorStep) * minorStep; gx <= maxW.wx; gx += minorStep) { const p = bpWorldToScreen(gx, 0, w, h, cam); c.moveTo(p.sx, 0); c.lineTo(p.sx, h); }
      for (let gy = Math.floor(minW.wy / minorStep) * minorStep; gy <= maxW.wy; gy += minorStep) { const p = bpWorldToScreen(0, gy, w, h, cam); c.moveTo(0, p.sy); c.lineTo(w, p.sy); }
      c.stroke();
    }
    c.strokeStyle = 'rgba(37, 99, 235, 0.12)';
    c.beginPath();
    for (let gx = Math.floor(minW.wx / majorStep) * majorStep; gx <= maxW.wx; gx += majorStep) { const p = bpWorldToScreen(gx, 0, w, h, cam); c.moveTo(p.sx, 0); c.lineTo(p.sx, h); }
    for (let gy = Math.floor(minW.wy / majorStep) * majorStep; gy <= maxW.wy; gy += majorStep) { const p = bpWorldToScreen(0, gy, w, h, cam); c.moveTo(0, p.sy); c.lineTo(w, p.sy); }
    c.stroke();

    const orig = bpWorldToScreen(0, 0, w, h, cam);
    c.strokeStyle = 'rgba(37, 99, 235, 0.28)'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(0, orig.sy); c.lineTo(w, orig.sy); c.moveTo(orig.sx, 0); c.lineTo(orig.sx, h); c.stroke();

    if (sheet.underlay === 'section') {
      const ax = sheet.sectionAxis || 'Z';
      const pos = typeof sheet.sectionPos === 'number' ? sheet.sectionPos : 30;
      const { cutRects, bgRects } = get3DSectionData(ax, pos);
      c.save();
      // Background uncut pieces in faint dashed lines
      c.setLineDash([3, 4]); c.strokeStyle = 'rgba(100, 116, 139, 0.35)'; c.lineWidth = 1;
      for (const r of bgRects) {
        const p0 = bpWorldToScreen(r.x, r.y + r.h, w, h, cam);
        c.strokeRect(p0.sx, p0.sy, r.w * cam.scale, r.h * cam.scale);
      }
      // Sliced cross-section pieces with bold outline + 45-deg hatching
      c.setLineDash([]);
      for (const r of cutRects) {
        const p0 = bpWorldToScreen(r.x, r.y + r.h, w, h, cam);
        const pw = r.w * cam.scale, ph = r.h * cam.scale;
        c.fillStyle = 'rgba(215, 164, 110, 0.25)';
        c.fillRect(p0.sx, p0.sy, pw, ph);
        drawHatchRect(c, p0.sx, p0.sy, pw, ph, 'rgba(154, 91, 37, 0.58)');
        c.strokeStyle = '#7f491b'; c.lineWidth = 2;
        c.strokeRect(p0.sx, p0.sy, pw, ph);
      }
      c.restore();
    } else if (sheet.underlay && sheet.underlay !== 'none') {
      const rects = get3DUnderlayRects(sheet.underlay);
      c.save(); c.setLineDash([4, 4]); c.strokeStyle = 'rgba(154, 91, 37, 0.38)'; c.fillStyle = 'rgba(215, 164, 110, 0.11)'; c.lineWidth = 1.2;
      for (const r of rects) {
        const p0 = bpWorldToScreen(r.x, r.y + r.h, w, h, cam);
        c.fillRect(p0.sx, p0.sy, r.w * cam.scale, r.h * cam.scale);
        c.strokeRect(p0.sx, p0.sy, r.w * cam.scale, r.h * cam.scale);
      }
      c.restore();
    }

    for (const s of sheet.shapes) drawOneBpShape(c, s, w, h, cam, interactive && isBpSelected(s.id));
    if (interactive && state.bp.selectedShapeIds.length === 1) {
      const singleSel = sheet.shapes.find(x => x.id === state.bp.selectedShapeIds[0]);
      if (singleSel) {
        c.save(); c.setLineDash([]);
        for (const hd of getBpHandles(singleSel)) {
          const pt = bpWorldToScreen(hd.x, hd.y, w, h, cam);
          c.fillStyle = '#ffffff'; c.strokeStyle = '#2563eb'; c.lineWidth = 2;
          c.fillRect(pt.sx - 4.5, pt.sy - 4.5, 9, 9);
          c.strokeRect(pt.sx - 4.5, pt.sy - 4.5, 9, 9);
        }
        c.restore();
      }
    }
    if (interactive && bpDraftShape) drawOneBpShape(c, bpDraftShape, w, h, cam, true, true);
    if (interactive && bpMarqueeRect) {
      const mx0 = Math.min(bpMarqueeRect.x1, bpMarqueeRect.x2), mx1 = Math.max(bpMarqueeRect.x1, bpMarqueeRect.x2);
      const my0 = Math.min(bpMarqueeRect.y1, bpMarqueeRect.y2), my1 = Math.max(bpMarqueeRect.y1, bpMarqueeRect.y2);
      const tl = bpWorldToScreen(mx0, my1, w, h, cam);
      const pw = (mx1 - mx0) * cam.scale, ph = (my1 - my0) * cam.scale;
      c.save();
      c.fillStyle = 'rgba(37, 99, 235, 0.12)';
      c.strokeStyle = '#2563eb';
      c.lineWidth = 1.4;
      c.setLineDash([5, 3]);
      c.fillRect(tl.sx, tl.sy, pw, ph);
      c.strokeRect(tl.sx, tl.sy, pw, ph);
      c.restore();
    }
  }

  function drawOneBpShape(c, s, w, h, cam, isSel, isPreview) {
    c.save();
    c.strokeStyle = isSel ? '#2563eb' : (s.color || '#1e242b');
    c.fillStyle = isSel ? '#2563eb' : (s.color || '#1e242b');
    c.lineWidth = (s.width || 2) + (isSel ? 1 : 0);
    if (s.dashed || isPreview) c.setLineDash([6, 4]);

    if (s.type === 'line') {
      const a = bpWorldToScreen(s.x1, s.y1, w, h, cam), b = bpWorldToScreen(s.x2, s.y2, w, h, cam);
      c.beginPath(); c.moveTo(a.sx, a.sy); c.lineTo(b.sx, b.sy); c.stroke();
      if (isSel || isPreview) drawBpTag(c, (a.sx + b.sx) / 2, (a.sy + b.sy) / 2 - 10, `${Math.hypot(s.x2 - s.x1, s.y2 - s.y1).toFixed(1)} cm`);
    } else if (s.type === 'rect') {
      const rx = Math.min(s.x, s.x + s.w), ry = Math.min(s.y, s.y + s.h), rw = Math.abs(s.w), rh = Math.abs(s.h);
      const tl = bpWorldToScreen(rx, ry + rh, w, h, cam);
      c.fillStyle = isSel ? 'rgba(37, 99, 235, 0.08)' : 'rgba(30, 36, 43, 0.03)';
      c.fillRect(tl.sx, tl.sy, rw * cam.scale, rh * cam.scale);
      c.strokeRect(tl.sx, tl.sy, rw * cam.scale, rh * cam.scale);
      if (isSel || isPreview) drawBpTag(c, tl.sx + (rw * cam.scale) / 2, tl.sy - 10, `${rw.toFixed(1)} × ${rh.toFixed(1)} cm`);
    } else if (s.type === 'circle') {
      const ctr = bpWorldToScreen(s.cx, s.cy, w, h, cam), sr = Math.max(2, s.r * cam.scale);
      c.beginPath(); c.arc(ctr.sx, ctr.sy, sr, 0, Math.PI * 2); c.stroke();
      c.setLineDash([]); c.lineWidth = 1;
      c.beginPath(); c.moveTo(ctr.sx - 4, ctr.sy); c.lineTo(ctr.sx + 4, ctr.sy); c.moveTo(ctr.sx, ctr.sy - 4); c.lineTo(ctr.sx, ctr.sy + 4); c.stroke();
      if (isSel || isPreview) drawBpTag(c, ctr.sx, ctr.sy - sr - 10, `Ø${(s.r * 2).toFixed(1)} cm`);
    } else if (s.type === 'dim') {
      const a = bpWorldToScreen(s.x1, s.y1, w, h, cam), b = bpWorldToScreen(s.x2, s.y2, w, h, cam);
      c.setLineDash([]); c.beginPath(); c.moveTo(a.sx, a.sy); c.lineTo(b.sx, b.sy); c.stroke();
      const ang = Math.atan2(b.sy - a.sy, b.sx - a.sx), px = -Math.sin(ang) * 6, py = Math.cos(ang) * 6;
      c.beginPath(); c.moveTo(a.sx - px, a.sy - py); c.lineTo(a.sx + px, a.sy + py); c.moveTo(b.sx - px, b.sy - py); c.lineTo(b.sx + px, b.sy + py); c.stroke();
      drawBpTag(c, (a.sx + b.sx) / 2, (a.sy + b.sy) / 2, `${Math.hypot(s.x2 - s.x1, s.y2 - s.y1).toFixed(1)} cm`, isSel ? '#2563eb' : (s.color || '#15803d'));
    } else if (s.type === 'text') {
      const p = bpWorldToScreen(s.x, s.y, w, h, cam);
      c.setLineDash([]); c.font = '700 12.5px "PingFang TC", "Microsoft JhengHei", sans-serif';
      const tw = c.measureText(s.text || '').width;
      if (isSel) { c.strokeStyle = '#2563eb'; c.lineWidth = 1; c.setLineDash([3, 2]); c.strokeRect(p.sx - 4, p.sy - 14, tw + 8, 20); c.setLineDash([]); }
      c.fillStyle = isSel ? '#2563eb' : (s.color || '#1e242b'); c.fillText(s.text || '', p.sx, p.sy);
    } else if (s.type === 'freehand' && s.points && s.points.length > 1) {
      c.beginPath();
      const p0 = bpWorldToScreen(s.points[0].x, s.points[0].y, w, h, cam); c.moveTo(p0.sx, p0.sy);
      for (let i = 1; i < s.points.length; i++) { const pi = bpWorldToScreen(s.points[i].x, s.points[i].y, w, h, cam); c.lineTo(pi.sx, pi.sy); }
      c.stroke();
    }
    c.restore();
  }

  function drawBpTag(c, sx, sy, text, color) {
    c.save(); c.setLineDash([]); c.font = '700 10.5px ui-monospace, Menlo, Consolas, monospace';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const tw = c.measureText(text).width + 10;
    c.fillStyle = 'rgba(255,255,255,0.94)'; c.strokeStyle = color || '#2563eb'; c.lineWidth = 1;
    roundRect(c, sx - tw / 2, sy - 9, tw, 18, 4); c.fill(); c.stroke();
    c.fillStyle = color || '#1e242b'; c.fillText(text, sx, sy + 0.5); c.restore();
  }

  function resizeBpCanvas() {
    const wrap = document.getElementById('bpCanvasWrap');
    const rect = wrap.getBoundingClientRect(); if (rect.width < 10) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    bpCanvas.width = Math.floor(rect.width * dpr); bpCanvas.height = Math.floor(rect.height * dpr);
    bpCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    renderBlueprintCanvas();
  }

  function renderBlueprintCanvas() {
    const wrap = document.getElementById('bpCanvasWrap');
    drawBlueprintOnContext(bpCtx, wrap.clientWidth || 800, wrap.clientHeight || 600, getActiveSheet(), state.bp, { interactive: true });
  }

  function renderRefCanvas() {
    const box = document.getElementById('refCanvasBox');
    const rect = box.getBoundingClientRect(); if (rect.width < 10 || rect.height < 10) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    refCanvas.width = Math.floor(rect.width * dpr); refCanvas.height = Math.floor(rect.height * dpr);
    refCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sheet = state.blueprints.find(s => s.id === state.refSheetId) || state.blueprints[0];
    if (!sheet) return;
    drawBlueprintOnContext(refCtx, rect.width, rect.height, sheet, computeFitCameraForSheet(sheet, rect.width, rect.height), { interactive: false });
  }

  function computeFitCameraForSheet(sheet, w, h) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    const addPt = (x, y) => { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); };
    for (const s of sheet.shapes) {
      if (s.type === 'line' || s.type === 'dim') { addPt(s.x1, s.y1); addPt(s.x2, s.y2); }
      else if (s.type === 'rect') { addPt(s.x, s.y); addPt(s.x + s.w, s.y + s.h); }
      else if (s.type === 'circle') { addPt(s.cx - s.r, s.cy - s.r); addPt(s.cx + s.r, s.cy + s.r); }
      else if (s.type === 'text') { addPt(s.x, s.y); addPt(s.x + 25, s.y + 6); }
      else if (s.type === 'freehand' && s.points) s.points.forEach(p => addPt(p.x, p.y));
    }
    if (sheet.underlay === 'section') {
      const sd = get3DSectionData(sheet.sectionAxis || 'Z', typeof sheet.sectionPos === 'number' ? sheet.sectionPos : 30);
      [...sd.cutRects, ...sd.bgRects].forEach(r => { addPt(r.x, r.y); addPt(r.x + r.w, r.y + r.h); });
    } else if (sheet.underlay && sheet.underlay !== 'none') {
      get3DUnderlayRects(sheet.underlay).forEach(r => { addPt(r.x, r.y); addPt(r.x + r.w, r.y + r.h); });
    }
    if (!isFinite(minX)) { minX = -10; maxX = 80; minY = -10; maxY = 80; }
    const spanX = Math.max(20, maxX - minX + 26), spanY = Math.max(20, maxY - minY + 26);
    const scale = Math.min((w - 140) / spanX, (h - 190) / spanY);
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    return { scale: Math.max(1.2, scale), panX: w / 2 - cx * Math.max(1.2, scale), panY: h / 2 - cy * Math.max(1.2, scale) };
  }

  function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
    if (l2 === 0) return Math.hypot(px - x1, py - y1);
    const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / l2));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function hitTestBpShape(wx, wy, sheet) {
    if (!sheet) return null;
    const tol = Math.max(1.5, 9 / state.bp.scale);
    for (let i = sheet.shapes.length - 1; i >= 0; i--) {
      const s = sheet.shapes[i];
      if (s.type === 'line' || s.type === 'dim') { if (distToSegment(wx, wy, s.x1, s.y1, s.x2, s.y2) <= tol) return s; }
      else if (s.type === 'rect') {
        const rx = Math.min(s.x, s.x + s.w), ry = Math.min(s.y, s.y + s.h), rw = Math.abs(s.w), rh = Math.abs(s.h);
        if (wx >= rx - tol && wx <= rx + rw + tol && wy >= ry - tol && wy <= ry + rh + tol) return s;
      } else if (s.type === 'circle') { if (Math.abs(Math.hypot(wx - s.cx, wy - s.cy) - s.r) <= tol || Math.hypot(wx - s.cx, wy - s.cy) <= tol) return s; }
      else if (s.type === 'text') { if (wx >= s.x - tol && wx <= s.x + Math.max(15, (s.text || '').length * 2.4) + tol && wy >= s.y - tol && wy <= s.y + 6 + tol) return s; }
      else if (s.type === 'freehand' && s.points) {
        for (let k = 1; k < s.points.length; k++) if (distToSegment(wx, wy, s.points[k - 1].x, s.points[k - 1].y, s.points[k].x, s.points[k].y) <= tol) return s;
      }
    }
    return null;
  }

  function translateBpShape(s, dx, dy) {
    if (s.type === 'line' || s.type === 'dim') { s.x1 += dx; s.y1 += dy; s.x2 += dx; s.y2 += dy; }
    else if (s.type === 'rect' || s.type === 'text') { s.x += dx; s.y += dy; }
    else if (s.type === 'circle') { s.cx += dx; s.cy += dy; }
    else if (s.type === 'freehand' && s.points) s.points.forEach(p => { p.x += dx; p.y += dy; });
  }


  function getBpHandles(s) {
    if (!s) return [];
    if (s.type === 'line' || s.type === 'dim') {
      return [{ id: 'p1', x: s.x1, y: s.y1 }, { id: 'p2', x: s.x2, y: s.y2 }];
    }
    if (s.type === 'rect') {
      const x0 = Math.min(s.x, s.x + s.w), x1 = Math.max(s.x, s.x + s.w);
      const y0 = Math.min(s.y, s.y + s.h), y1 = Math.max(s.y, s.y + s.h);
      return [
        { id: 'sw', x: x0, y: y0 }, { id: 'se', x: x1, y: y0 },
        { id: 'nw', x: x0, y: y1 }, { id: 'ne', x: x1, y: y1 }
      ];
    }
    if (s.type === 'circle') {
      return [
        { id: 'e', x: s.cx + s.r, y: s.cy }, { id: 'w', x: s.cx - s.r, y: s.cy },
        { id: 'n', x: s.cx, y: s.cy + s.r }, { id: 's', x: s.cx, y: s.cy - s.r }
      ];
    }
    return [];
  }

  function hitTestBpHandle(wx, wy, s, cam) {
    const tol = Math.max(1.4, 9 / cam.scale);
    for (const h of getBpHandles(s)) {
      if (Math.hypot(wx - h.x, wy - h.y) <= tol) return h.id;
    }
    return null;
  }

  function getRectFixedAnchor(s, handleId) {
    const x0 = Math.min(s.x, s.x + s.w), x1 = Math.max(s.x, s.x + s.w);
    const y0 = Math.min(s.y, s.y + s.h), y1 = Math.max(s.y, s.y + s.h);
    return {
      ax: handleId.includes('w') ? x1 : x0,
      ay: handleId.includes('s') ? y1 : y0
    };
  }

  function applyBpHandleDrag(s, handleId, wx, wy, ortho, anchor) {
    if (s.type === 'line' || s.type === 'dim') {
      if (handleId === 'p1') {
        if (ortho) { if (Math.abs(wx - s.x2) >= Math.abs(wy - s.y2)) wy = s.y2; else wx = s.x2; }
        s.x1 = wx; s.y1 = wy;
      } else {
        if (ortho) { if (Math.abs(wx - s.x1) >= Math.abs(wy - s.y1)) wy = s.y1; else wx = s.x1; }
        s.x2 = wx; s.y2 = wy;
      }
    } else if (s.type === 'rect' && anchor) {
      s.x = Math.min(anchor.ax, wx);
      s.w = Math.max(0.5, Number(Math.abs(wx - anchor.ax).toFixed(2)));
      s.y = Math.min(anchor.ay, wy);
      s.h = Math.max(0.5, Number(Math.abs(wy - anchor.ay).toFixed(2)));
    } else if (s.type === 'circle') {
      s.r = Math.max(0.5, Number(Math.hypot(wx - s.cx, wy - s.cy).toFixed(1)));
    }
  }

  let bpMarqueeRect = null;
  let bpSpacePanning = false;

  function isBpSelected(id) {
    return state.bp.selectedShapeIds.includes(id);
  }

  function getBpSelectedShapes(sh) {
    if (!sh) return [];
    const set = new Set(state.bp.selectedShapeIds);
    return sh.shapes.filter(x => set.has(x.id));
  }

  function getBpShapeBBox(s) {
    if (s.type === 'line' || s.type === 'dim') {
      return { minX: Math.min(s.x1, s.x2), maxX: Math.max(s.x1, s.x2), minY: Math.min(s.y1, s.y2), maxY: Math.max(s.y1, s.y2) };
    }
    if (s.type === 'rect') {
      return { minX: Math.min(s.x, s.x + s.w), maxX: Math.max(s.x, s.x + s.w), minY: Math.min(s.y, s.y + s.h), maxY: Math.max(s.y, s.y + s.h) };
    }
    if (s.type === 'circle') {
      return { minX: s.cx - s.r, maxX: s.cx + s.r, minY: s.cy - s.r, maxY: s.cy + s.r };
    }
    if (s.type === 'text') {
      const approxW = Math.max(12, (s.text || '').length * 2.2);
      return { minX: s.x, maxX: s.x + approxW, minY: s.y - 2, maxY: s.y + 5 };
    }
    if (s.type === 'freehand' && s.points && s.points.length) {
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of s.points) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }
      return { minX, maxX, minY, maxY };
    }
    return { minX: 0, maxX: 0, minY: 0, maxY: 0 };
  }

  function shapeIntersectsMarquee(s, m) {
    const b = getBpShapeBBox(s);
    const mx0 = Math.min(m.x1, m.x2), mx1 = Math.max(m.x1, m.x2);
    const my0 = Math.min(m.y1, m.y2), my1 = Math.max(m.y1, m.y2);
    return b.maxX >= mx0 && b.minX <= mx1 && b.maxY >= my0 && b.minY <= my1;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function renderBOM(container, onlyDynamic) {
    if (!state.pieces.length) { container.innerHTML = '<div class="alert-box alert-info">尚未有構件，請先新增材料即可自動估算裁切排版。</div>'; return; }
    if (!onlyDynamic || !container.querySelector('#bomDynamicContent')) {
      container.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;background:var(--surface-2);padding:5px 8px;border-radius:6px;border:1px solid var(--border);">
          <label for="kerfInput" style="font-size:11.5px;font-weight:700;color:var(--ink-muted);">鋸片損耗（鋸路 cm）</label>
          <input id="kerfInput" type="number" min="0" max="1" step="0.05" value="${state.kerfCm}" style="width:72px;text-align:right;font-family:var(--mono);">
        </div>
        <div id="bomDynamicContent"></div>`;
    }
    const dynTarget = container.querySelector('#bomDynamicContent');
    const bom = computeBOM();
    const totalStockItems = bom.summaryRows.reduce((s, r) => s + r.qty, 0);
    const segPalette = ['#9a5b25', '#b46d2e', '#7c4d25', '#2563eb', '#0f766e', '#6d28d9', '#be185d'];

    let html = bom.excludedPieces.length ? `
      <div class="alert-box alert-warn">
        <strong>${bom.excludedPieces.length} 個構件超出單件原料尺寸</strong>
        <p>採購數量和費用只計入可裁切的構件。</p>
        <ul>${bom.excludedPieces.map(item => `<li>${escapeHtml(describeExcludedCut(item))}</li>`).join('')}</ul>
      </div>` : '';

    if (!bom.summaryRows.length) {
      dynTarget.innerHTML = html + '<div class="alert-box alert-info">目前沒有可裁切的構件，尚無採購估算。</div>';
      return;
    }

    html += `<div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">預估材料總費</div><div class="kpi-val">NT$${bom.grandTotalCost.toLocaleString()}</div><div class="kpi-sub">單價可修改</div></div>
        <div class="kpi-card"><div class="kpi-label">需採購原料</div><div class="kpi-val">${totalStockItems} 件</div><div class="kpi-sub">${bom.summaryRows.length} 種規格</div></div>
        <div class="kpi-card"><div class="kpi-label">預估裁切刀數</div><div class="kpi-val">${bom.totalCuts} 刀</div><div class="kpi-sub">鋸路 ${state.kerfCm} cm</div></div>
      </div>
      <table class="data-table">
        <thead><tr><th>材料規格</th><th class="num">數量</th><th class="num">利用率</th><th class="num">單價</th><th class="num">小計</th></tr></thead>
        <tbody>
          ${bom.summaryRows.map(r => `
            <tr>
              <td><div style="font-weight:700;">${escapeHtml(r.material.name)}</div><div style="font-size:10px;color:var(--ink-soft);">${escapeHtml(r.material.taiwanSpec)}</div></td>
              <td class="num"><strong>${r.qty}</strong> ${r.material.unit}</td>
              <td class="num">${r.utilPct.toFixed(1)}%</td>
              <td class="num"><input class="price-input" type="number" min="0" step="5" data-price-mat="${r.material.id}" value="${r.unitPrice}"></td>
              <td class="num"><strong>$${r.subtotal.toLocaleString()}</strong></td>
            </tr>`).join('')}
        </tbody>
      </table>`;

    if (bom.battenPlans.length) {
      html += `<div class="section-title">角材 1D 裁切排版圖</div>`;
      for (const plan of bom.battenPlans) {
        html += `<div class="cut-card"><div class="cut-card-header"><span>${escapeHtml(plan.material.name)}</span><span style="font-family:var(--mono);color:var(--accent);">${plan.bins.length} 支 (${plan.utilPct.toFixed(1)}%)</span></div>
          ${plan.bins.map((bin, idx) => {
            const rem = Math.max(0, plan.material.stockL - bin.used);
            return `<div class="bar-row"><div class="bar-label"><span>第 ${idx + 1} 支 (${plan.material.stockL}cm)</span><span>用 ${bin.used.toFixed(1)} ｜ 餘 ${rem.toFixed(1)}</span></div>
              <div class="bar-track">${bin.cuts.map((c, ci) => `<div class="bar-seg" style="width:${Math.min(100, (c.l / plan.material.stockL) * 100).toFixed(2)}%;background:${segPalette[ci % segPalette.length]};">${c.l}</div>`).join('')}
              ${rem > 0.5 ? `<div class="bar-waste">${rem >= 15 ? '餘' + rem.toFixed(0) : ''}</div>` : ''}</div></div>`;
          }).join('')}</div>`;
      }
    }

    if (bom.sheetPlans.length) {
      html += `<div class="section-title">板材 2D 裁切排版圖</div>`;
      for (const plan of bom.sheetPlans) {
        const m = plan.material;
        html += `<div class="cut-card"><div class="cut-card-header"><span>${escapeHtml(m.name)}</span><span style="font-family:var(--mono);color:var(--accent);">${plan.sheets.length} 片 (${plan.utilPct.toFixed(1)}%)</span></div>
          ${plan.sheets.map((sheet, idx) => `<div style="margin-bottom:8px;"><div class="bar-label"><span>第 ${idx + 1} 片 (${m.stockL}×${m.stockW}cm)</span><span>${sheet.rects.length} 塊</span></div>
            <svg class="sheet-svg" viewBox="0 0 ${m.stockL} ${m.stockW}"><rect x="0" y="0" width="${m.stockL}" height="${m.stockW}" fill="#ece6da"/>
            ${sheet.rects.map(rc => `<g><rect x="${rc.x}" y="${rc.y}" width="${rc.w}" height="${rc.h}" fill="${m.category === 'csb' ? '#cbd5e1' : '#d8ad78'}" stroke="${m.category === 'csb' ? '#475569' : '#7c4d25'}" stroke-width="1.2"/>
              <text x="${rc.x + rc.w / 2}" y="${rc.y + rc.h / 2}" text-anchor="middle" dominant-baseline="middle" font-size="${Math.max(6, Math.min(13, Math.min(rc.w, rc.h) * 0.22))}" font-weight="700" fill="#1e242b" font-family="monospace">${rc.w.toFixed(0)}×${rc.h.toFixed(0)}</text></g>`).join('')}</svg></div>`).join('')}</div>`;
      }
    }

    html += `<div class="section-box"><div class="section-title">接合與五金統計</div><table class="data-table"><thead><tr><th>接合方式</th><th class="num">構件數</th><th class="num">預估點數</th></tr></thead><tbody>
      ${Object.entries(bom.joinerySummary).map(([jId, info]) => `<tr><td>${escapeHtml(JOINERY_MAP[jId] ? JOINERY_MAP[jId].label : jId)}</td><td class="num">${info.count}</td><td class="num">${info.points > 0 ? info.points + ' 點' : '—'}</td></tr>`).join('')}
    </tbody></table></div>`;
    dynTarget.innerHTML = html;
  }

    const card = document.getElementById('bpPropCard');

    }

      state.bpStyleCardOpen = false;

    }
    setCardHidden(card, false);

    if (selShapes.length > 1) {
      body.innerHTML = `
        <div class="alert-box alert-info" style="margin-bottom:8px;">
          已框選 <strong>${selShapes.length}</strong> 個圖元，可直接在畫布拖曳整組移動，或於左側批次改色／線寬。

        <div class="nudge-row" style="margin-bottom:10px;">
          <button class="btn btn-xs" type="button" data-bp-batch-nudge="-1,0">X -1</button>
          <button class="btn btn-xs" type="button" data-bp-batch-nudge="1,0">X +1</button>
          <button class="btn btn-xs" type="button" data-bp-batch-nudge="0,-1">Y -1</button>
          <button class="btn btn-xs" type="button" data-bp-batch-nudge="0,1">Y +1</button>

          <button class="btn btn-xs btn-blue" type="button" data-bp-align="left">左對齊</button>
          <button class="btn btn-xs btn-blue" type="button" data-bp-align="right">右對齊</button>
          <button class="btn btn-xs btn-blue" type="button" data-bp-align="bottom">下對齊</button>
          <button class="btn btn-xs btn-blue" type="button" data-bp-align="top">上對齊</button>

        <div class="form-field"><label>終點 X2 (cm)</label><input type="number" step="0.5" data-bp-prop="x2" value="${s.x2.toFixed(1)}"></div>
        <div class="form-field"><label>終點 Y2 (cm)</label><input type="number" step="0.5" data-bp-prop="y2" value="${s.y2.toFixed(1)}"></div>
        <div class="form-field full"><label>長度</label><input type="text" disabled value="${len.toFixed(2)} cm（${(len / 30.3).toFixed(2)} 台尺）"></div>`;
    } else if (s.type === 'rect') {
      fieldsHtml = `
        <div class="form-field"><label>左下 X (cm)</label><input type="number" step="0.5" data-bp-prop="x" value="${s.x.toFixed(1)}"></div>
        <div class="form-field"><label>左下 Y (cm)</label><input type="number" step="0.5" data-bp-prop="y" value="${s.y.toFixed(1)}"></div>
        <div class="form-field"><label>寬度 W (cm)</label><input type="number" step="0.5" data-bp-prop="w" value="${s.w.toFixed(1)}"></div>
        <div class="form-field"><label>高度 H (cm)</label><input type="number" step="0.5" data-bp-prop="h" value="${s.h.toFixed(1)}"></div>
        <div class="form-field full" style="margin-top:4px;"><button id="btnRectTo3D" class="btn btn-primary" type="button" style="width:100%;">將此矩形轉為 3D 構件 →</button></div>`;
    } else if (s.type === 'circle') {
      fieldsHtml = `
        <div class="form-field"><label>圓心 X (cm)</label><input type="number" step="0.5" data-bp-prop="cx" value="${s.cx.toFixed(1)}"></div>
        <div class="form-field"><label>圓心 Y (cm)</label><input type="number" step="0.5" data-bp-prop="cy" value="${s.cy.toFixed(1)}"></div>
        <div class="form-field full"><label>半徑 R (cm) ｜ 直徑 ${(s.r * 2).toFixed(1)} cm</label><input type="number" step="0.5" min="0.5" data-bp-prop="r" value="${s.r.toFixed(1)}"></div>`;

  function initAddForm() {
    document.getElementById('addMaterial').innerHTML = MATERIALS.map(m => `<option value="${m.id}">[${m.categoryLabel}] ${escapeHtml(m.name)}</option>`).join('');
    document.getElementById('addJoinery').innerHTML = JOINERY_OPTIONS.map(j => `<option value="${j.id}">${escapeHtml(j.label)}</option>`).join('');
    syncAddFormByMaterial();
  }

  function syncAddFormByMaterial() {
    const m = MAT_MAP[document.getElementById('addMaterial').value]; if (!m) return;
    const isBatten = m.category === 'batten';
    document.getElementById('addCutWWrap').style.opacity = isBatten ? '0.5' : '1';
    document.getElementById('addCutW').disabled = isBatten;
    document.getElementById('addCutW').value = isBatten ? m.stockW : Math.min(60, m.stockW);
    document.getElementById('addOrient').innerHTML = isBatten
      ? '<option value="X">沿 X 軸（橫料）</option><option value="Z">沿 Z 軸（立柱）</option><option value="Y">沿 Y 軸（深向）</option>'
      : '<option value="XY">水平板（桌面/層板）</option><option value="XZ">直立正面（封板/背板）</option><option value="YZ">直立側面（側板）</option>';
    document.getElementById('addJoinery').value = isBatten ? 'glue_nail' : (m.category === 'csb' ? 'csb_staple' : 'wood_screw');
  }

  function addPiece(materialId, opts) {
    const m = MAT_MAP[materialId]; if (!m) return;
    const isBatten = m.category === 'batten';
    const newPiece = {
      id: uid(), name: (opts && opts.name) || `${m.categoryLabel} #${state.pieces.length + 1}`,
      materialId: m.id,
      cutL: Number((opts && opts.cutL) || (isBatten ? 60 : Math.min(90, m.stockL))),
      cutW: isBatten ? m.stockW : Number((opts && opts.cutW) || Math.min(60, m.stockW)),
      x: 0, y: 0, z: 0,
      orientation: (opts && opts.orientation) || (isBatten ? 'X' : 'XY'),
      flipSection: false,
      joinery: (opts && opts.joinery) || (isBatten ? 'glue_nail' : (m.category === 'csb' ? 'csb_staple' : 'wood_screw')),
      notes: (opts && opts.notes) || ''
    };
    const pos = findNonCollidingPlacement(newPiece, state.pieces.find(x => x.id === state.selectedId) || null);
    newPiece.x = pos.x; newPiece.y = pos.y; newPiece.z = pos.z;
    pushHistory3D(`新增「${newPiece.name}」`);
    state.pieces.push(newPiece);
    state.selectedId = newPiece.id;
    state.activeTab = 'inspector';
    state.rightDrawerOpen = true;
    renderAll();
    showToast(`已新增「${newPiece.name}」並自動避開重疊`);
  }

  function duplicatePiece(id) {
    const orig = state.pieces.find(p => p.id === id); if (!orig) return;
    const copy = Object.assign({}, orig, { id: uid(), name: orig.name + ' (複製)' });
    const pos = findNonCollidingPlacement(copy, orig);
    copy.x = pos.x; copy.y = pos.y; copy.z = pos.z;
    pushHistory3D(`複製「${orig.name}」`);
    state.pieces.push(copy); state.selectedId = copy.id; renderAll();
    showToast(`已複製「${orig.name}」並貼齊空位`);
  }

  function deletePiece(id) {
    const idx = state.pieces.findIndex(p => p.id === id); if (idx === -1) return;
    const name = state.pieces[idx].name;
    pushHistory3D(`刪除「${name}」`);
    state.pieces.splice(idx, 1);
    if (state.selectedId === id) state.selectedId = state.pieces.length ? state.pieces[Math.max(0, idx - 1)].id : null;
    renderAll(); showToast(`已刪除「${name}」`);
  }

  function switchPage(page) {
    state.activePage = page;
    document.getElementById('page3D').classList.toggle('active', page === '3d');
    document.getElementById('pageBlueprint').classList.toggle('active', page === 'blueprint');
    document.getElementById('pageSplit').classList.toggle('active', page === 'split');
    for (const button of document.querySelectorAll('.page-switch-btn')) {
      const active = button.dataset.page === page;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    }
    renderAll();
    setTimeout(() => {
      resizeCanvas();
      if (page === 'blueprint') document.getElementById('btnBpFit').click();
      if (page === 'split') fitSplitBpCanvas();
    }, 25);
  }

  let toastTimer = null;
  function showToast(msg, actionObj) {
    const el = document.getElementById('toast');
    el.innerHTML = `<span>${escapeHtml(msg)}</span>` + (actionObj ? `<button id="toastActionBtn" class="btn btn-xs btn-soft" type="button">${escapeHtml(actionObj.label)}</button>` : '');
    if (actionObj) {
      const ab = document.getElementById('toastActionBtn');
      if (ab) ab.addEventListener('click', () => { el.classList.remove('show'); actionObj.onClick(); });
    }
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), actionObj ? 5000 : 2400);
  }

  function copyBomText() {
    if (!state.pieces.length) { showToast('目前沒有構件可複製'); return; }
    const bom = computeBOM();
    const lines = [`【${state.projectName}】木工採購與裁切清單`, `鋸路損耗 ${state.kerfCm} cm`, '', '一、採購清單'];
    for (const r of bom.summaryRows) lines.push(`- ${r.material.name} (${r.material.taiwanSpec})：${r.qty} ${r.material.unit} × NT$${r.unitPrice} = NT$${r.subtotal}`);
    if (bom.summaryRows.length) {
      const scope = bom.excludedPieces.length ? '（只計入可裁切構件）' : '';
      lines.push(`預估總計${scope} NT$${bom.grandTotalCost.toLocaleString()}`);
    } else {
      lines.push('目前沒有可裁切的構件，尚無採購估算。');
    }
    lines.push('', '二、裁切明細');
    if (!bom.cutPieces.length) lines.push('目前沒有可裁切的構件。');
    for (const { name, l, w, material } of bom.cutPieces) {
      lines.push(`- ${name}｜${material.name}｜${formatCutSize(material, l, w)}`);
    }
    if (bom.excludedPieces.length) {
      lines.push('', '三、超出單件原料尺寸的構件（未列入估算）');
      for (const item of bom.excludedPieces) lines.push('- ' + describeExcludedCut(item));
    }
    const text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => showToast('已複製採購與裁切清單')).catch(() => fallbackCopy(text));
    else fallbackCopy(text);
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('已複製採購與裁切清單'); } catch (e) { showToast('複製失敗'); }
    document.body.removeChild(ta);
  }

  function projectRecord(value) {
    return value !== null && typeof value === 'object' && !Array.isArray(value);
  }

  function projectNumber(value) {
    return typeof value === 'number' || (typeof value === 'string' && value.trim()) ? Number(value) : NaN;
  }

  function importId(value, prefix, used) {
    let id = Number.isSafeInteger(value) ? String(value) : value;
    if (id == null || id === '') {
      do { id = uid(prefix); } while (used.has(id));
    }
    if (typeof id !== 'string' || !/^[A-Za-z0-9_][A-Za-z0-9_.:-]*$/.test(id) ||
        Object.hasOwn(Object.prototype, id) || used.has(id)) return null;
    used.add(id);
    return id;
  }

  function validateImportShape(shape, usedIds) {
    if (!projectRecord(shape)) return '圖紙內含不合法圖元';
    const id = importId(shape.id, 's', usedIds);
    if (!id) return '同一張圖紙的圖元識別碼無效或重複';
    const { type } = shape;
    const coordinates = {
      line: ['x1', 'y1', 'x2', 'y2'], dim: ['x1', 'y1', 'x2', 'y2'],
      rect: ['x', 'y', 'w', 'h'], circle: ['cx', 'cy', 'r'], text: ['x', 'y'],
      freehand: []
    };
    if (typeof type !== 'string' || !Object.hasOwn(coordinates, type)) return '圖紙有未知圖元類型';
    if (!coordinates[type].every(key => Number.isFinite(shape[key])) || (type === 'circle' && shape.r <= 0)) {
      return '圖紙圖元的座標或尺寸無效';
    }
    const color = shape.color ?? '#1e242b', width = shape.width ?? 2, dashed = shape.dashed ?? false;
    if (typeof color !== 'string' || !Number.isFinite(width) || width <= 0 || typeof dashed !== 'boolean') {
      return '圖紙圖元的樣式無效';
    }
    const validated = { id, type, color, width, dashed };
    for (const key of coordinates[type]) validated[key] = shape[key];
    if (type === 'text') {
      if (typeof shape.text !== 'string') return '文字標註格式無效';
      validated.text = shape.text;
    }
    if (type === 'freehand') {
      if (!Array.isArray(shape.points) || shape.points.length < 2 ||
          !shape.points.every(pt => projectRecord(pt) && Number.isFinite(pt.x) && Number.isFinite(pt.y))) {
        return '手繪線包含無效座標點';
      }
      validated.points = shape.points.map(({ x, y }) => ({ x, y }));
    }
    return validated;
  }

  function validateImportPayload(obj, defaultTitle = '匯入專案') {
    if (!projectRecord(obj)) return '根結構必須為物件';
    if (obj.version !== undefined && obj.version !== 1 && obj.version !== 2) return '不支援此專案檔版本';
    if (!Array.isArray(obj.pieces)) return '缺少 pieces 陣列';
    const validPieces = [], pieceIds = new Set();
    for (const p of obj.pieces) {
      if (!projectRecord(p) || typeof p.materialId !== 'string' || !Object.hasOwn(MAT_MAP, p.materialId)) {
        return '構件資料含無效項目或未知材料';
      }
      const id = importId(p.id, 'p', pieceIds);
      if (!id) return '構件識別碼無效或重複';
      const mat = MAT_MAP[p.materialId];
      const cutL = projectNumber(p.cutL), cutW = p.cutW == null || p.cutW === '' ? mat.stockW : projectNumber(p.cutW);
      if (![cutL, cutW].every(value => Number.isFinite(value) && value > 0)) return '構件尺寸無效';
      const [x, y, z] = [p.x, p.y, p.z].map(projectNumber);
      if (![x, y, z].every(Number.isFinite)) return '構件座標無效';
      const orientations = mat.category === 'batten' ? ['X', 'Y', 'Z'] : ['XY', 'XZ', 'YZ'];
      const orientation = p.orientation ?? orientations[2];
      const joinery = p.joinery ?? 'none';
      if (!orientations.includes(orientation) || typeof joinery !== 'string' || !Object.hasOwn(JOINERY_MAP, joinery)) {
        return '構件方向或接合方式無效';
      }
      const name = p.name ?? '未命名構件', notes = p.notes ?? '', flipSection = p.flipSection ?? false;
      if (typeof name !== 'string' || typeof notes !== 'string' || typeof flipSection !== 'boolean') {
        return '構件名稱、備註或轉向格式無效';
      }
      validPieces.push({ id, name, materialId: p.materialId, cutL, cutW, x, y, z, orientation, flipSection, joinery, notes });
    }
    let validBlueprints = null;
    if (obj.blueprints !== undefined) {
      if (!Array.isArray(obj.blueprints) || obj.blueprints.length === 0) return '圖紙清單格式無效';
      validBlueprints = [];
      const sheetIds = new Set();
      for (const sh of obj.blueprints) {
        if (!projectRecord(sh) || !Array.isArray(sh.shapes)) return '圖紙缺少合法的 shapes 陣列';
        const id = importId(sh.id, 'sh', sheetIds);
        if (!id) return '圖紙識別碼無效或重複';
        const name = sh.name ?? '未命名圖紙', underlay = sh.underlay ?? 'none';
        if (typeof name !== 'string' || !['none', 'top', 'front', 'side', 'section'].includes(underlay)) {
          return '圖紙名稱或底圖無效';
        }
        const { sectionAxis, sectionPos } = sh;
        if ((sectionAxis !== undefined && !['X', 'Y', 'Z'].includes(sectionAxis)) ||
            (sectionPos !== undefined && !Number.isFinite(sectionPos))) return '剖視圖的軸向或座標無效';
        const shapeIds = new Set(), shapes = [];
        for (const shape of sh.shapes) {
          const validated = validateImportShape(shape, shapeIds);
          if (typeof validated === 'string') return validated;
          shapes.push(validated);
        }
        validBlueprints.push({ id, name, underlay, sectionAxis, sectionPos, shapes });
      }
    }
    const validPrices = {};
    if (projectRecord(obj.customPrices)) {
      for (const [k, v] of Object.entries(obj.customPrices)) {
        const price = projectNumber(v);
        if (Object.hasOwn(MAT_MAP, k) && Number.isFinite(price) && price >= 0) validPrices[k] = price;
      }
    }
    const matchingSheet = id => validBlueprints?.find(sheet => sheet.id === id)?.id;
    return {
      projectName: typeof obj.projectName === 'string' ? obj.projectName.trim() || defaultTitle : defaultTitle,
      kerfCm: (typeof obj.kerfCm === 'number' && Number.isFinite(obj.kerfCm) && obj.kerfCm >= 0) ? obj.kerfCm : 0.3,
      customPrices: validPrices,
      pieces: validPieces,
      blueprints: validBlueprints,
      activeSheetId: matchingSheet(obj.activeSheetId),
      refSheetId: matchingSheet(obj.refSheetId)
    };
  }
