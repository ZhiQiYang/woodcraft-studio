  const active3DPtrs = new Map();
  let prev3DPinch = null, prev3DMid = null;
  let dragMode = null, lastX = 0, lastY = 0, dragDist = 0;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    active3DPtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (active3DPtrs.size >= 2) {
      dragMode = 'pinch'; prev3DPinch = null; prev3DMid = null; return;
    }
    dragMode = (e.shiftKey || e.button === 2 || state.panMode3D) ? 'pan' : 'orbit';
    lastX = e.clientX; lastY = e.clientY; dragDist = 0;
  });
  canvas.addEventListener('pointermove', e => {
    if (active3DPtrs.has(e.pointerId)) active3DPtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (active3DPtrs.size >= 2) {
      const [a, b] = Array.from(active3DPtrs.values());
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (prev3DPinch && dist > 10) state.camera.zoom = Math.max(0.35, Math.min(3.5, state.camera.zoom * (dist / prev3DPinch)));
      if (prev3DMid) { state.camera.panX += (mid.x - prev3DMid.x); state.camera.panY += (mid.y - prev3DMid.y); }
      prev3DPinch = dist; prev3DMid = mid; renderScene(); return;
    }
    if (!dragMode || dragMode === 'pinch') return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; dragDist += Math.hypot(dx, dy);
    if (dragMode === 'orbit') { state.camera.yaw += dx * 0.008; state.camera.pitch = Math.max(-1.52, Math.min(1.54, state.camera.pitch + dy * 0.008)); }
    else { state.camera.panX += dx; state.camera.panY += dy; }
    renderScene();
  });
  function end3DPtr(e) {

    if (active3DPtrs.size < 2) { prev3DPinch = null; prev3DMid = null; }
    if (active3DPtrs.size === 0) {

        }
      }
      dragMode = null;
    }
  }

      return;
    }
    const p = state.pieces.find(x => x.id === state.selectedId); if (!p) return;
    const warnEl = document.getElementById('insCoordWarn');
    if (t.id === 'insName') p.name = t.value;

    else if (['insCutL', 'insCutW', 'insX', 'insY', 'insZ'].includes(t.id)) {

  // Blueprint Canvas Drawing
  function commitBpDragIfChanged(sh, drag) {
    if (!sh || !drag || !drag.beforeSnap) return;
    if (JSON.stringify(sh.shapes) !== drag.beforeSnap) {
      recordBpShapeHistory(sh, drag.beforeSnap);
      saveToLocal();
    }
  }

  const activeBpPtrs = new Map();
  let prevBpPinch = null, prevBpMid = null;
  let bpDragState = null, bpDraftShape = null, pendingTextWorld = null;
  bpCanvas.addEventListener('pointerdown', e => {
    const sh = getActiveSheet(); if (!sh) return;
    const rect = bpCanvas.getBoundingClientRect(), sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const w = rect.width, h = rect.height;
    activeBpPtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activeBpPtrs.size >= 2) {
      bpCanvas.setPointerCapture(e.pointerId);
      if (bpDragState && (bpDragState.mode === 'move' || bpDragState.mode === 'resize')) commitBpDragIfChanged(sh, bpDragState);
      bpDraftShape = null; bpMarqueeRect = null; bpDragState = { mode: 'pinch' }; prevBpPinch = null; prevBpMid = null;
      renderBlueprintCanvas(); return;
    }
    if (e.button === 2 || e.button === 1 || bpSpacePanning || state.panModeBp) {
      bpCanvas.setPointerCapture(e.pointerId);
      bpDragState = { mode: 'pan', startSx: sx, startSy: sy, origPanX: state.bp.panX, origPanY: state.bp.panY }; return;
    }
    const raw = bpScreenToWorld(sx, sy, w, h, state.bp), wx = snapVal(raw.wx), wy = snapVal(raw.wy), tool = state.bp.tool;
    if (tool === 'text') {
      pendingTextWorld = { x: wx, y: wy };
      const modal = document.getElementById('bpTextModal');
      modal.style.left = Math.min(w - 234, Math.max(12, sx)) + 'px';
      modal.style.top = Math.min(h - 96, Math.max(110, sy)) + 'px';
      modal.classList.add('open');
      const inp = document.getElementById('bpTextInput'); inp.value = ''; setTimeout(() => inp.focus(), 20); return;
    }
    bpCanvas.setPointerCapture(e.pointerId);
    if (tool === 'select') {
      if (state.bp.selectedShapeIds.length === 1) {
        const singleSel = sh.shapes.find(x => x.id === state.bp.selectedShapeIds[0]);
        const hdId = singleSel && hitTestBpHandle(raw.wx, raw.wy, singleSel, state.bp);
        if (hdId) {
          const anchor = singleSel.type === 'rect' ? getRectFixedAnchor(singleSel, hdId) : null;
          bpDragState = { mode: 'resize', shape: singleSel, handleId: hdId, anchor, beforeSnap: JSON.stringify(sh.shapes), moved: false };
          return;
        }
      }
      const hit = hitTestBpShape(raw.wx, raw.wy, sh);
      if (hit) {
        if (e.shiftKey) {
          if (isBpSelected(hit.id)) state.bp.selectedShapeIds = state.bp.selectedShapeIds.filter(id => id !== hit.id);
          else state.bp.selectedShapeIds.push(hit.id);
        } else if (!isBpSelected(hit.id)) {
          state.bp.selectedShapeIds = [hit.id];
        }
        renderBpInspector(); renderBlueprintCanvas();
        const shapesToMove = getBpSelectedShapes(sh);
        if (shapesToMove.length) {
          bpDragState = { mode: 'move', shapes: shapesToMove, lastWx: wx, lastWy: wy, beforeSnap: JSON.stringify(sh.shapes), moved: false };
        }
      } else {
        if (!e.shiftKey) state.bp.selectedShapeIds = [];
        bpMarqueeRect = { x1: raw.wx, y1: raw.wy, x2: raw.wx, y2: raw.wy };
        bpDragState = { mode: 'marquee', additive: e.shiftKey, startSx: sx, startSy: sy };
        renderBpInspector(); renderBlueprintCanvas();
      }
      return;
    }
    const base = { id: uid('s'), color: state.bp.color, width: state.bp.width, dashed: state.bp.dashed };
    if (tool === 'line' || tool === 'dim') bpDraftShape = Object.assign(base, { type: tool, x1: wx, y1: wy, x2: wx, y2: wy });
    else if (tool === 'rect') bpDraftShape = Object.assign(base, { type: 'rect', x: wx, y: wy, w: 0, h: 0 });
    else if (tool === 'circle') bpDraftShape = Object.assign(base, { type: 'circle', cx: wx, cy: wy, r: 0 });
    else if (tool === 'freehand') bpDraftShape = Object.assign(base, { type: 'freehand', points: [{ x: raw.wx, y: raw.wy }] });
    bpDragState = { mode: 'draw', startWx: wx, startWy: wy }; renderBlueprintCanvas();
  });

  bpCanvas.addEventListener('pointermove', e => {
    const rect = bpCanvas.getBoundingClientRect(), sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const raw = bpScreenToWorld(sx, sy, rect.width, rect.height, state.bp), wx = snapVal(raw.wx), wy = snapVal(raw.wy);
    document.getElementById('bpCoordReadout').textContent = `X ${wx.toFixed(1)}, Y ${wy.toFixed(1)} cm ｜ ${Math.round((state.bp.scale / 5.0) * 100)}%`;
    if (activeBpPtrs.has(e.pointerId)) activeBpPtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activeBpPtrs.size >= 2) {
      const [a, b] = Array.from(activeBpPtrs.values());
      const dist = Math.hypot(a.x - b.x, a.y - b.y), mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (prevBpPinch && dist > 10) state.bp.scale = Math.max(0.8, Math.min(24, state.bp.scale * (dist / prevBpPinch)));
      if (prevBpMid) { state.bp.panX += (mid.x - prevBpMid.x); state.bp.panY -= (mid.y - prevBpMid.y); }
      prevBpPinch = dist; prevBpMid = mid; renderBlueprintCanvas(); return;
    }
    if (!bpDragState || bpDragState.mode === 'pinch') return;
    if (bpDragState.mode === 'resize') {
      bpDragState.moved = true;
      applyBpHandleDrag(bpDragState.shape, bpDragState.handleId, wx, wy, state.bp.ortho || e.shiftKey, bpDragState.anchor);
      renderBlueprintCanvas(); renderBpInspector(); return;
    }
    if (bpDragState.mode === 'pan') { state.bp.panX = bpDragState.origPanX + (sx - bpDragState.startSx); state.bp.panY = bpDragState.origPanY - (sy - bpDragState.startSy); renderBlueprintCanvas(); return; }
    if (bpDragState.mode === 'marquee' && bpMarqueeRect) {
      bpMarqueeRect.x2 = raw.wx; bpMarqueeRect.y2 = raw.wy;
      renderBlueprintCanvas(); return;
    }
    if (bpDragState.mode === 'move') {
      const dx = wx - bpDragState.lastWx, dy = wy - bpDragState.lastWy;
      if (dx !== 0 || dy !== 0) {
        bpDragState.moved = true;
        bpDragState.shapes.forEach(shp => translateBpShape(shp, dx, dy));
        bpDragState.lastWx = wx; bpDragState.lastWy = wy; renderBlueprintCanvas(); renderBpInspector();
      }
      return;
    }
    if (bpDragState.mode === 'draw' && bpDraftShape) {
      let tx = wx, ty = wy;
      if ((state.bp.ortho || e.shiftKey) && (bpDraftShape.type === 'line' || bpDraftShape.type === 'dim')) {
        if (Math.abs(tx - bpDragState.startWx) >= Math.abs(ty - bpDragState.startWy)) ty = bpDragState.startWy; else tx = bpDragState.startWx;
      }
      if (bpDraftShape.type === 'line' || bpDraftShape.type === 'dim') { bpDraftShape.x2 = tx; bpDraftShape.y2 = ty; }
      else if (bpDraftShape.type === 'rect') { bpDraftShape.w = tx - bpDragState.startWx; bpDraftShape.h = ty - bpDragState.startWy; }

  function endBpPtr(e) {
    activeBpPtrs.delete(e.pointerId);
    if (activeBpPtrs.size < 2) { prevBpPinch = null; prevBpMid = null; }
    if (activeBpPtrs.size > 0) return;
    const sh = getActiveSheet();
    if (bpDragState && bpDragState.mode === 'draw' && bpDraftShape && sh) {
      let valid = true;
      if ((bpDraftShape.type === 'line' || bpDraftShape.type === 'dim') && Math.hypot(bpDraftShape.x2 - bpDraftShape.x1, bpDraftShape.y2 - bpDraftShape.y1) < 0.4) valid = false;
      if (bpDraftShape.type === 'rect') {
        if (Math.abs(bpDraftShape.w) < 0.4 || Math.abs(bpDraftShape.h) < 0.4) valid = false;
        else { if (bpDraftShape.w < 0) { bpDraftShape.x += bpDraftShape.w; bpDraftShape.w = -bpDraftShape.w; } if (bpDraftShape.h < 0) { bpDraftShape.y += bpDraftShape.h; bpDraftShape.h = -bpDraftShape.h; } }
      }
      if (bpDraftShape.type === 'circle' && bpDraftShape.r < 0.4) valid = false;
      if (bpDraftShape.type === 'freehand' && bpDraftShape.points.length < 2) valid = false;

    } else if (bpDragState && bpDragState.mode === 'marquee' && bpMarqueeRect && sh) {
      const span = Math.hypot(bpMarqueeRect.x2 - bpMarqueeRect.x1, bpMarqueeRect.y2 - bpMarqueeRect.y1);
      if (span > 0.5) {
        const matched = sh.shapes.filter(x => shapeIntersectsMarquee(x, bpMarqueeRect)).map(x => x.id);

    const rect = splitBpCanvas.getBoundingClientRect(), sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const raw = bpScreenToWorld(sx, sy, rect.width, rect.height, state.splitBpCam), wx = snapVal(raw.wx), wy = snapVal(raw.wy);
    document.getElementById('splitBpCoord').textContent = `X ${wx.toFixed(1)}, Y ${wy.toFixed(1)} cm`;
    if (activeSplitBpPtrs.has(e.pointerId)) activeSplitBpPtrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activeSplitBpPtrs.size >= 2) {
      const [a, b] = Array.from(activeSplitBpPtrs.values());
      const dist = Math.hypot(a.x - b.x, a.y - b.y), mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (prevSplitBpPinch && dist > 10) state.splitBpCam.scale = Math.max(0.8, Math.min(24, state.splitBpCam.scale * (dist / prevSplitBpPinch)));
      if (prevSplitBpMid) { state.splitBpCam.panX += (mid.x - prevSplitBpMid.x); state.splitBpCam.panY -= (mid.y - prevSplitBpMid.y); }
      prevSplitBpPinch = dist; prevSplitBpMid = mid; renderSplitViews(); return;
    }
    if (!splitBpDrag || splitBpDrag.mode === 'pinch') return;
    if (splitBpDrag.mode === 'pan') { state.splitBpCam.panX = splitBpDrag.origPanX + (sx - splitBpDrag.startSx); state.splitBpCam.panY = splitBpDrag.origPanY - (sy - splitBpDrag.startSy); renderSplitViews(); return; }
    if (splitBpDrag.mode === 'resize') {
      splitBpDrag.moved = true;
      applyBpHandleDrag(splitBpDrag.shape, splitBpDrag.handleId, wx, wy, state.bp.ortho || e.shiftKey, splitBpDrag.anchor);
      renderSplitViews(); return;
    }
    if (splitBpDrag.mode === 'marquee' && bpMarqueeRect) { bpMarqueeRect.x2 = raw.wx; bpMarqueeRect.y2 = raw.wy; renderSplitViews(); return; }
    if (splitBpDrag.mode === 'move') {
      const dx = wx - splitBpDrag.lastWx, dy = wy - splitBpDrag.lastWy;
      if (dx !== 0 || dy !== 0) {
        splitBpDrag.moved = true;
        splitBpDrag.shapes.forEach(shp => translateBpShape(shp, dx, dy));
        splitBpDrag.lastWx = wx; splitBpDrag.lastWy = wy; renderSplitViews();
      }
      return;
    }
    if (splitBpDrag.mode === 'draw' && bpDraftShape) {
      let tx = wx, ty = wy;
      if ((state.bp.ortho || e.shiftKey) && (bpDraftShape.type === 'line' || bpDraftShape.type === 'dim')) {
        if (Math.abs(tx - splitBpDrag.startWx) >= Math.abs(ty - splitBpDrag.startWy)) ty = splitBpDrag.startWy; else tx = splitBpDrag.startWx;
      }
      if (bpDraftShape.type === 'line' || bpDraftShape.type === 'dim') { bpDraftShape.x2 = tx; bpDraftShape.y2 = ty; }
      else if (bpDraftShape.type === 'rect') { bpDraftShape.w = tx - splitBpDrag.startWx; bpDraftShape.h = ty - splitBpDrag.startWy; }
      else if (bpDraftShape.type === 'circle') bpDraftShape.r = Math.max(0.5, Number(Math.hypot(tx - splitBpDrag.startWx, ty - splitBpDrag.startWy).toFixed(1)));
      else if (bpDraftShape.type === 'freehand') bpDraftShape.points.push({ x: raw.wx, y: raw.wy });
      renderSplitViews();
    }
  });
  function endSplitBpPtr(e) {
    activeSplitBpPtrs.delete(e.pointerId);
    if (activeSplitBpPtrs.size < 2) { prevSplitBpPinch = null; prevSplitBpMid = null; }
    if (activeSplitBpPtrs.size > 0) return;
    const sh = getActiveSheet();
    if (splitBpDrag && splitBpDrag.mode === 'draw' && bpDraftShape && sh) {
      let valid = true;
      if ((bpDraftShape.type === 'line' || bpDraftShape.type === 'dim') && Math.hypot(bpDraftShape.x2 - bpDraftShape.x1, bpDraftShape.y2 - bpDraftShape.y1) < 0.4) valid = false;
      if (bpDraftShape.type === 'rect') {
        if (Math.abs(bpDraftShape.w) < 0.4 || Math.abs(bpDraftShape.h) < 0.4) valid = false;
        else { if (bpDraftShape.w < 0) { bpDraftShape.x += bpDraftShape.w; bpDraftShape.w = -bpDraftShape.w; } if (bpDraftShape.h < 0) { bpDraftShape.y += bpDraftShape.h; bpDraftShape.h = -bpDraftShape.h; } }
      }
      if (bpDraftShape.type === 'circle' && bpDraftShape.r < 0.4) valid = false;
      if (bpDraftShape.type === 'freehand' && bpDraftShape.points.length < 2) valid = false;
      if (valid) { pushBpUndo(); sh.shapes.push(bpDraftShape); state.bp.selectedShapeIds = [bpDraftShape.id]; saveToLocal(); }
      bpDraftShape = null; renderSplitViews();
    } else if (splitBpDrag && splitBpDrag.mode === 'marquee' && bpMarqueeRect && sh) {
      const span = Math.hypot(bpMarqueeRect.x2 - bpMarqueeRect.x1, bpMarqueeRect.y2 - bpMarqueeRect.y1);
      if (span > 0.5) {
        const matched = sh.shapes.filter(x => shapeIntersectsMarquee(x, bpMarqueeRect)).map(x => x.id);
        if (splitBpDrag.additive) state.bp.selectedShapeIds = Array.from(new Set([...state.bp.selectedShapeIds, ...matched]));
        else state.bp.selectedShapeIds = matched;
        if (matched.length) showToast(`已框選 ${state.bp.selectedShapeIds.length} 個圖元`);
      }
      bpMarqueeRect = null; renderSplitViews();
    } else if (splitBpDrag && (splitBpDrag.mode === 'move' || splitBpDrag.mode === 'resize')) {
      commitBpDragIfChanged(sh, splitBpDrag);
    }
    splitBpDrag = null;
  }
  splitBpCanvas.addEventListener('pointerup', endSplitBpPtr);
  splitBpCanvas.addEventListener('pointercancel', endSplitBpPtr);
  splitBpCanvas.addEventListener('contextmenu', e => e.preventDefault());
  splitBpCanvas.addEventListener('wheel', e => { e.preventDefault(); state.splitBpCam.scale = Math.max(0.8, Math.min(24, state.splitBpCam.scale * (e.deltaY > 0 ? 0.9 : 1.12))); renderSplitViews(); }, { passive: false });

  // Split 3D Canvas Pointer Events (Unified Multi-Touch Pinch-Zoom + Orbit/Pan)
  const activeS3Ptrs = new Map();
  let prevS3Pinch = null, prevS3Mid = null;
  let s3Drag = null, s3LastX = 0, s3LastY = 0, s3Dist = 0;
  split3DCanvas.addEventListener('pointerdown', e => {
    split3DCanvas.setPointerCapture(e.pointerId);
    activeS3Ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activeS3Ptrs.size >= 2) { s3Drag = 'pinch'; prevS3Pinch = null; prevS3Mid = null; return; }
    s3Drag = (e.shiftKey || e.button === 2 || state.panMode3D) ? 'pan' : 'orbit';
    s3LastX = e.clientX; s3LastY = e.clientY; s3Dist = 0;
  });
  split3DCanvas.addEventListener('pointermove', e => {
    if (activeS3Ptrs.has(e.pointerId)) activeS3Ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activeS3Ptrs.size >= 2) {
      const [a, b] = Array.from(activeS3Ptrs.values());
      const dist = Math.hypot(a.x - b.x, a.y - b.y), mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (prevS3Pinch && dist > 10) state.camera.zoom = Math.max(0.35, Math.min(3.5, state.camera.zoom * (dist / prevS3Pinch)));
      if (prevS3Mid) { state.camera.panX += (mid.x - prevS3Mid.x); state.camera.panY += (mid.y - prevS3Mid.y); }
      prevS3Pinch = dist; prevS3Mid = mid; renderSplitViews(); return;
    }
    if (!s3Drag || s3Drag === 'pinch') return;
    const dx = e.clientX - s3LastX, dy = e.clientY - s3LastY; s3LastX = e.clientX; s3LastY = e.clientY; s3Dist += Math.hypot(dx, dy);
    if (s3Drag === 'orbit') { state.camera.yaw += dx * 0.008; state.camera.pitch = Math.max(-1.52, Math.min(1.54, state.camera.pitch + dy * 0.008)); }
    else { state.camera.panX += dx; state.camera.panY += dy; }
    renderSplitViews();
  });
  function endS3Ptr(e) {
    activeS3Ptrs.delete(e.pointerId);
    if (activeS3Ptrs.size < 2) { prevS3Pinch = null; prevS3Mid = null; }
    if (activeS3Ptrs.size === 0) {
      if (s3Drag && s3Drag !== 'pinch' && s3Dist < 5) {
        const rect = split3DCanvas.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
        for (let i = splitHitPolygons.length - 1; i >= 0; i--) {
          if (pointInPoly(mx, my, splitHitPolygons[i].pts)) { state.selectedId = splitHitPolygons[i].pieceId; renderAll(); break; }
        }
      }
      s3Drag = null;
    }
  }
  split3DCanvas.addEventListener('pointerup', endS3Ptr);
  split3DCanvas.addEventListener('pointercancel', endS3Ptr);
  split3DCanvas.addEventListener('contextmenu', e => e.preventDefault());
  split3DCanvas.addEventListener('wheel', e => { e.preventDefault(); state.camera.zoom = Math.max(0.35, Math.min(3.5, state.camera.zoom * (e.deltaY > 0 ? 0.92 : 1.09))); renderSplitViews(); }, { passive: false });

  // Live Section Plane Sliders (in Blueprint Style Card & Split View)
  document.getElementById('bpSecAxis').addEventListener('change', e => {
    const sh = getActiveSheet(); if (!sh) return;
    sh.sectionAxis = e.target.value;
    const rng = getAxisBounds(sh.sectionAxis);
    sh.sectionPos = Number(((rng.min + rng.max) / 2).toFixed(1));
    renderAll();
  });
  document.getElementById('bpSecSlider').addEventListener('input', e => {
    const sh = getActiveSheet(); if (!sh) return;
    sh.sectionPos = parseFloat(e.target.value) || 0;
    document.getElementById('bpSecNum').value = sh.sectionPos;
    renderBlueprintCanvas(); saveToLocal();
  });
  document.getElementById('bpSecNum').addEventListener('input', e => {
    const sh = getActiveSheet(); if (!sh) return;
    sh.sectionPos = parseFloat(e.target.value) || 0;
    document.getElementById('bpSecSlider').value = sh.sectionPos;
    renderBlueprintCanvas(); saveToLocal();
  });
  document.getElementById('splitSecSlider').addEventListener('input', e => {
    const sh = getActiveSheet(); if (!sh) return;
    sh.sectionPos = parseFloat(e.target.value) || 0;
    renderSplitViews(); saveToLocal();
  });

  // View & Custom Cross-Section Generator Modal
  function openViewModal() {
    lastModalTrigger = document.activeElement;
    const modal = document.getElementById('viewGeneratorModal');
    const ax = document.getElementById('modalSecAxis').value;
    updateModalSectionRange(ax);
    modal.classList.add('open');
    setTimeout(() => { const f = modal.querySelector('button, select, input'); if (f) f.focus(); }, 20);
  }
  function updateModalSectionRange(ax) {
    const rng = getAxisBounds(ax);
    const mid = Number(((rng.min + rng.max) / 2).toFixed(1));
    const sl = document.getElementById('modalSecSlider');
    sl.min = rng.min; sl.max = rng.max; sl.value = mid;
    document.getElementById('modalSecPos').value = mid;
    document.getElementById('modalSecRangeHint').textContent = `${mid} cm（結構範圍 ${rng.min}~${rng.max} cm）`;
  }

  document.getElementById('btnOpenViewModal').addEventListener('click', openViewModal);
  document.getElementById('btnSplitAddView').addEventListener('click', openViewModal);
  document.getElementById('btnCloseViewModal').addEventListener('click', closeViewModal);
  document.getElementById('modalSecAxis').addEventListener('change', e => updateModalSectionRange(e.target.value));
  document.getElementById('modalSecSlider').addEventListener('input', e => {
    const v = parseFloat(e.target.value) || 0;
    document.getElementById('modalSecPos').value = v;
    const rng = getAxisBounds(document.getElementById('modalSecAxis').value);
    document.getElementById('modalSecRangeHint').textContent = `${v} cm（結構範圍 ${rng.min}~${rng.max} cm）`;
  });
  document.getElementById('modalSecPos').addEventListener('input', e => {
    const v = parseFloat(e.target.value) || 0;
    document.getElementById('modalSecSlider').value = v;
  });

  function createViewSheet(kind, opts) {
    const includeLines = document.getElementById('modalIncludeLines').checked;
    const shapes = [];
    const b = getOverallBounds();
    let name = '', underlay = kind, secAxis = 'Z', secPos = 30;

    if (kind === 'top' || kind === 'front' || kind === 'side') {
      const labels = { top: '俯視圖 (XY)', front: '前視圖 (XZ)', side: '側視圖 (YZ)' };
      name = labels[kind];
      if (includeLines && state.pieces.length) {
        const rects = get3DUnderlayRects(kind);
        for (const r of rects) shapes.push({ id: uid('s'), type: 'rect', x: r.x, y: r.y, w: r.w, h: r.h, color: '#1d4ed8', width: 2, dashed: false });
        const ox = kind === 'side' ? b.minY : b.minX, ow = kind === 'side' ? b.sizeY : b.sizeX;
        const oy = kind === 'top' ? b.minY : b.minZ, oh = kind === 'top' ? b.sizeY : b.sizeZ;
        shapes.push({ id: uid('s'), type: 'dim', x1: ox, y1: oy - 8, x2: ox + ow, y2: oy - 8, color: '#15803d', width: 1.5, dashed: false });
        shapes.push({ id: uid('s'), type: 'dim', x1: ox - 8, y1: oy, x2: ox - 8, y2: oy + oh, color: '#15803d', width: 1.5, dashed: false });
      }
    } else {
      underlay = 'section';
      secAxis = (opts && opts.axis) || 'Z';
      secPos = (opts && typeof opts.pos === 'number') ? opts.pos : 30;
      const axisLbl = { Z: '水平剖面', Y: '前後縱剖', X: '左右橫剖' }[secAxis];
      name = `${axisLbl} ${secAxis}=${secPos}cm`;
      if (includeLines && state.pieces.length) {
        const { cutRects } = get3DSectionData(secAxis, secPos);
        for (const r of cutRects) shapes.push({ id: uid('s'), type: 'rect', x: r.x, y: r.y, w: r.w, h: r.h, color: '#9a5b25', width: 2.5, dashed: false });
        if (cutRects.length) {
          const minX = Math.min(...cutRects.map(r => r.x)), maxX = Math.max(...cutRects.map(r => r.x + r.w));
          const minY = Math.min(...cutRects.map(r => r.y)), maxY = Math.max(...cutRects.map(r => r.y + r.h));
          if (maxX - minX > 0.1) shapes.push({ id: uid('s'), type: 'dim', x1: minX, y1: minY - 8, x2: maxX, y2: minY - 8, color: '#15803d', width: 1.5, dashed: false });
          if (maxY - minY > 0.1) shapes.push({ id: uid('s'), type: 'dim', x1: minX - 8, y1: minY, x2: minX - 8, y2: maxY, color: '#15803d', width: 1.5, dashed: false });
        }
        shapes.push({ id: uid('s'), type: 'text', x: 0, y: -16, text: `剖切面：${axisLbl} ${secAxis} = ${secPos} cm（共剖切 ${cutRects.length} 件）`, color: '#1d4ed8', width: 2 });
      }
    }

    const newSh = { id: uid('sh'), name, underlay, sectionAxis: secAxis, sectionPos: secPos, shapes };
    const insertIdx = state.blueprints.length;
    const previousRefId = state.refSheetId, previousActiveId = state.activeSheetId;
    state.blueprints.push(newSh);
    state.activeSheetId = newSh.id;
    state.refSheetId = newSh.id;
    recordBpSheetHistory({ kind: 'addSheet', sheetId: newSh.id, sheetJson: JSON.stringify(newSh), index: insertIdx, activeBefore: previousActiveId, activeAfter: newSh.id, refBefore: previousRefId, refAfter: newSh.id, label: `建立「${name}」` });
    state.bp.selectedShapeIds = [];

    closeViewModal();
    renderAll();
    if (state.activePage === 'blueprint') document.getElementById('btnBpFit').click();
    if (state.activePage === 'split') fitSplitBpCanvas();
    showToast(`已建立「${name}」分頁`);
  }

  document.querySelectorAll('[data-create-view]').forEach(btn => btn.addEventListener('click', () => {
    createViewSheet(btn.dataset.createView);
  }));
  document.getElementById('btnCreateSectionSheet').addEventListener('click', () => {
    createViewSheet('section', {
      axis: document.getElementById('modalSecAxis').value,
      pos: parseFloat(document.getElementById('modalSecPos').value) || 0
    });
  });

  window.addEventListener('keyup', e => {
    if (e.code === 'Space') {
      bpSpacePanning = false;
      bpCanvas.style.cursor = state.bp.tool === 'select' ? 'default' : 'crosshair';
      splitBpCanvas.style.cursor = state.bp.tool === 'select' ? 'default' : 'crosshair';
    }
  });


  // Mobile mutual exclusion for left/right 3D drawers & top "+ 新增構件" toggle
  document.getElementById('btnToggleAddForm').addEventListener('click', () => {
    const box = document.getElementById('addPieceBox');
    const open = box.style.display === 'none';
    box.style.display = open ? 'block' : 'none';
  });

  // 3D & Blueprint Zoom +/- and Pan Mode buttons (for touch & mouse)
  document.getElementById('btn3DZoomIn').addEventListener('click', () => {
    state.camera.zoom = Math.min(3.5, state.camera.zoom * 1.18); renderScene();
  });
  document.getElementById('btn3DZoomOut').addEventListener('click', () => {
    state.camera.zoom = Math.max(0.35, state.camera.zoom * 0.85); renderScene();
  });
  document.getElementById('btn3DPanMode').addEventListener('click', e => {
    state.panMode3D = !state.panMode3D;
    e.currentTarget.textContent = state.panMode3D ? '平移模式' : '旋轉模式';
    e.currentTarget.classList.toggle('active', state.panMode3D);
    showToast(state.panMode3D ? '已切為單指平移畫布模式' : '已切為單指旋轉 3D 模式');
  });

  document.getElementById('btnBpZoomIn').addEventListener('click', () => {
    state.bp.scale = Math.min(24, state.bp.scale * 1.2); renderBlueprintCanvas();
  });
  document.getElementById('btnBpZoomOut').addEventListener('click', () => {
    state.bp.scale = Math.max(0.8, state.bp.scale * 0.84); renderBlueprintCanvas();
  });
  document.getElementById('btnBpPanToggle').addEventListener('click', e => {
    state.panModeBp = !state.panModeBp;
    e.currentTarget.classList.toggle('active', state.panModeBp);
    bpCanvas.style.cursor = state.panModeBp ? 'grab' : (state.bp.tool === 'select' ? 'default' : 'crosshair');
    showToast(state.panModeBp ? '單指拖曳即可平移圖紙' : '已恢復繪圖／選取模式');
  });

  // Track active pane in Split View for Ctrl+Z/Y
  document.getElementById('splitLeftPane').addEventListener('pointerdown', () => { state.lastFocusedPane = 'bp'; }, true);
  document.getElementById('splitRightPane').addEventListener('pointerdown', () => { state.lastFocusedPane = '3d'; }, true);
  document.getElementById('splitLeftPane').addEventListener('focusin', () => { state.lastFocusedPane = 'bp'; });
  document.getElementById('splitRightPane').addEventListener('focusin', () => { state.lastFocusedPane = '3d'; });

  // Multi-touch pinch-zoom & two-finger pan are integrated directly into canvas pointer handlers above

  // Modal focus management & Escape/backdrop close
  let lastModalTrigger = null;
  function closeViewModal() {
    const m = document.getElementById('viewGeneratorModal');
    m.classList.remove('open');
    if (lastModalTrigger && lastModalTrigger.focus) lastModalTrigger.focus();
  }
  document.getElementById('viewGeneratorModal').addEventListener('click', e => {
    if (e.target.id === 'viewGeneratorModal') closeViewModal();
  });
  window.addEventListener('keydown', e => {
    const modal = document.getElementById('viewGeneratorModal');
    if (!modal.classList.contains('open')) return;
    if (e.key === 'Escape') { e.preventDefault(); closeViewModal(); return; }
    if (e.key === 'Tab') {
      const focusables = Array.from(modal.querySelectorAll('button, select, input, [tabindex]:not([tabindex="-1"])')).filter(el => !el.disabled);
      if (!focusables.length) return;
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });


  document.getElementById('btnSplitBpDel').addEventListener('click', () => document.getElementById('btnBpDeleteSel').click());

  const fileMenuBtn = document.getElementById('btnFileMenu');
  const fileMenuDrop = document.getElementById('fileMenuDropdown');
  if (fileMenuBtn && fileMenuDrop) {
    fileMenuBtn.addEventListener('click', e => {
      e.stopPropagation();
      const open = !fileMenuDrop.classList.contains('open');
      fileMenuDrop.classList.toggle('open', open);
      fileMenuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    fileMenuDrop.addEventListener('click', e => {
      const proxy = e.target.closest('[data-menu-proxy]');
      if (proxy) {
        fileMenuDrop.classList.remove('open');
        const targetBtn = document.getElementById(proxy.dataset.menuProxy);
        if (targetBtn) targetBtn.click();
      }
    });
    document.addEventListener('click', () => {
      fileMenuDrop.classList.remove('open');
      fileMenuBtn.setAttribute('aria-expanded', 'false');
    });
  }

  window.addEventListener('beforeprint', () => {
    const sh = getActiveSheet();
    const t = document.getElementById('bpPrintTitle');
    const m = document.getElementById('bpPrintMeta');
    if (t) t.textContent = `${state.projectName} — ${(sh && sh.name) || '設計圖紙'}`;
    if (m) m.textContent = `格線 1大格=10cm ｜ 1台尺=30.3cm ｜ 列印日期 ${new Date().toLocaleDateString()}`;
  });

  window.addEventListener('resize', () => { syncDrawerVisibility(); resizeCanvas(); });
  const restoredLocalProject = loadInitialState();
  initAddForm();
  renderAll(restoredLocalProject);
  if (!restoredLocalProject) {
    setSaveStatus(false, '舊專案讀取失敗');
    showToast('無法讀取瀏覽器中的舊專案。可從檔案選單匯入 JSON 備份。');
  }
  resizeCanvas();
})();
</script>
