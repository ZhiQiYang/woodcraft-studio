<!doctype html>
<html lang="zh-Hant">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../gongban.css"><meta charset="utf-8"><title>Sheet — preview</title></head>
<body class="gb gb-preview" style="padding:0">
  <div class="gb-scrim" style="position:relative;width:390px;height:400px;display:flex;flex-direction:column;justify-content:flex-end">
    <section class="gb-sheet" aria-label="構件清單" style="max-height:320px">
      <div class="gb-sheet__grip" aria-hidden="true"></div>
      <div class="gb-sheet__head"><h2 class="gb-sheet__title">構件清單</h2><span class="gb-panel__count" style="margin-right:8px">4 件</span>
        <button type="button" class="gb-iconbtn" aria-label="關閉"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="gb-sheet__body gb-list">
        <button type="button" class="gb-row" aria-selected="true"><i class="gb-row__swatch"></i><span class="gb-row__main"><span class="gb-row__name">下橫料</span><span class="gb-row__meta">60 cm · 3.2 × 2.6 · 角材</span></span></button>
        <button type="button" class="gb-row"><i class="gb-row__swatch"></i><span class="gb-row__main"><span class="gb-row__name">上橫料</span><span class="gb-row__meta">60 cm · 3.2 × 2.6 · 角材</span></span></button>
        <button type="button" class="gb-row"><i class="gb-row__swatch"></i><span class="gb-row__main"><span class="gb-row__name">左立柱</span><span class="gb-row__meta">53.6 cm · 3.2 × 2.6 · 角材</span></span></button>
      </div>
    </section>
  </div>
</body>
</html>
