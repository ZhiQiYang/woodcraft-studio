<!doctype html>
<html lang="zh-Hant">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../gongban.css"><meta charset="utf-8"><title>ToolDock — preview</title></head>
<body class="gb gb-preview gb-preview--col" style="align-items:flex-start">
  <div class="gb-dock" role="toolbar" aria-label="平面圖工具">
    <button type="button" class="gb-iconbtn" aria-label="選取" aria-pressed="true"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 4 6 15 2.5-6.5L20 10z"/></svg></button>
    <button type="button" class="gb-iconbtn" aria-label="平移畫面"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
    <button type="button" class="gb-iconbtn" aria-label="量測"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 14-14 4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg></button>
    <span class="gb-dock__sep" aria-hidden="true"></span>
    <button type="button" class="gb-iconbtn" aria-label="磁吸貼齊" aria-pressed="true"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v8a6 6 0 0 0 12 0V4h-4v8a2 2 0 0 1-4 0V4z"/><path d="M6 8h4M14 8h4"/></svg></button>
    <span class="gb-dock__sep" aria-hidden="true"></span>
    <button type="button" class="gb-iconbtn" aria-label="縮小"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <span class="gb-dock__label">100%</span>
    <button type="button" class="gb-iconbtn" aria-label="放大"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" class="gb-iconbtn" aria-label="顯示全部"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button>
  </div>
  <div class="gb-dock" role="toolbar" aria-label="3D 視角">
    <div class="gb-seg" role="group" aria-label="視角" style="border:0;background:transparent;padding:0">
      <button type="button" class="gb-seg__item" aria-pressed="true">等角</button>
      <button type="button" class="gb-seg__item" aria-pressed="false">正視</button>
      <button type="button" class="gb-seg__item" aria-pressed="false">俯視</button>
      <button type="button" class="gb-seg__item" aria-pressed="false">側視</button>
    </div>
  </div>
</body>
</html>
