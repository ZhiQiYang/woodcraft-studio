<!doctype html>
<html lang="zh-Hant">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../gongban.css"><meta charset="utf-8"><title>ListRow — preview</title></head>
<body class="gb gb-preview gb-preview--surface" style="padding:0">
  <div class="gb-list" role="listbox" aria-label="構件清單" style="width:340px;border-right:1px solid var(--gb-line)">
    <button type="button" class="gb-row" role="option" aria-selected="true"><i class="gb-row__swatch"></i><span class="gb-row__main"><span class="gb-row__name">下橫料</span><span class="gb-row__meta">60 cm · 3.2 × 2.6 · 角材</span></span><span class="gb-row__end"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></button>
    <button type="button" class="gb-row" role="option" aria-selected="false"><i class="gb-row__swatch"></i><span class="gb-row__main"><span class="gb-row__name">左立柱</span><span class="gb-row__meta">53.6 cm · 3.2 × 2.6 · 角材</span></span></button>
    <button type="button" class="gb-row" role="option" aria-selected="false"><i class="gb-row__swatch gb-row__swatch--concrete"></i><span class="gb-row__main"><span class="gb-row__name">柱 01</span><span class="gb-row__meta">350 × 350 × 2,800 mm</span></span><span class="gb-row__end"><svg class="gb-icon" viewBox="0 0 24 24" aria-label="尺寸未確認" role="img" style="color:var(--gb-warn)"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h0"/></svg></span></button>
    <button type="button" class="gb-row is-hidden" role="option" aria-selected="false"><i class="gb-row__swatch gb-row__swatch--concrete"></i><span class="gb-row__main"><span class="gb-row__name">樑 01(已隱藏)</span><span class="gb-row__meta">6,000 × 350 × 400 mm</span></span></button>
  </div>
</body>
</html>
