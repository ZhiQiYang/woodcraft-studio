<!doctype html>
<html lang="zh-Hant">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../gongban.css"><meta charset="utf-8"><title>DataTable — preview</title></head>
<body class="gb gb-preview gb-preview--surface gb-preview--col" style="max-width:640px">
  <div class="gb-table-wrap">
    <table class="gb-table">
      <thead><tr><th scope="col">材料</th><th scope="col" class="gb-num">裁切</th><th scope="col" class="gb-num">採購</th><th scope="col" class="gb-num">單價</th><th scope="col" class="gb-num">小計</th></tr></thead>
      <tbody>
        <tr><td>柳安防腐角材<span class="gb-table__sub gb-num">8尺 × 1.2寸 × 1寸</span></td><td class="gb-num">4 段</td><td class="gb-num">1 支</td><td class="gb-num">[單價]</td><td class="gb-num">[小計]</td></tr>
        <tr><td>木心板<span class="gb-table__sub gb-num">4 × 8 尺 · 6 分</span></td><td class="gb-num">2 片</td><td class="gb-num">1 張</td><td class="gb-num">[單價]</td><td class="gb-num">[小計]</td></tr>
        <tr><td>矽酸鈣板<span class="gb-table__sub gb-num">3 × 6 尺 · 6 mm</span></td><td class="gb-num">3 片</td><td class="gb-num">2 張</td><td class="gb-num">[單價]</td><td class="gb-num">[小計]</td></tr>
      </tbody>
      <tfoot><tr><td colspan="4">合計(只含可裁切的材料)</td><td class="gb-num">[合計]</td></tr></tfoot>
    </table>
  </div>
</body>
</html>
