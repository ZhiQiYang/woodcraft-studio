<!doctype html>
<html lang="zh-Hant">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../gongban.css"><meta charset="utf-8"><title>Notice — preview</title></head>
<body class="gb gb-preview gb-preview--surface gb-preview--col" style="max-width:520px">
  <div class="gb-notice" role="status"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h0"/></svg>
    <div class="gb-notice__body"><strong class="gb-notice__title">2 件超出庫存規格</strong>左立柱、右立柱比 8 尺角材長,不會算進採購數量。</div></div>
  <div class="gb-notice gb-notice--danger" role="alert"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h0"/></svg>
    <div class="gb-notice__body"><strong class="gb-notice__title">這台裝置無法自動儲存</strong>先匯出專案檔,以免關掉頁面後進度不見。</div>
    <button type="button" class="gb-btn gb-dense" style="--gb-h:36px">匯出專案</button></div>
  <div class="gb-notice gb-notice--ok" role="status"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
    <div class="gb-notice__body">已複製採購清單,可以貼到 LINE。</div></div>
</body>
</html>
