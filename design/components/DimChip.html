<!doctype html>
<html lang="zh-Hant">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../gongban.css"><meta charset="utf-8"><title>DimChip — preview</title></head>
<body class="gb gb-preview" style="padding:0;gap:0;align-items:stretch">
  <div style="flex:1;min-width:200px;height:200px;background:var(--gb-surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;padding:16px">
    <span class="gb-dim">6,000</span>
    <button type="button" class="gb-dim gb-dim--active" aria-label="編輯尺寸 4,500 mm">4,500 <span class="gb-dim__unit">mm</span></button>
    <span class="gb-dim gb-dim--ref">2,800 mm</span>
  </div>
  <div style="flex:1;min-width:200px;height:200px;background:var(--mat-wood);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;padding:16px">
    <span class="gb-dim">60 cm</span>
    <span class="gb-dim">53.6 cm</span>
    <span class="gb-tag">下橫料 · 60 cm</span>
  </div>
  <div style="flex:1;min-width:200px;height:200px;background:var(--mat-concrete);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;padding:16px">
    <span class="gb-dim">350 × 350</span>
    <span class="gb-dim gb-dim--active">2,800</span>
    <span class="gb-tag">柱 01</span>
  </div>
</body>
</html>
