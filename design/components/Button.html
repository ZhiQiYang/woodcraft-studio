<!doctype html>
<html lang="zh-Hant">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../gongban.css"><meta charset="utf-8"><title>Button — preview</title></head>
<body class="gb gb-preview">
  <button type="button" class="gb-btn gb-btn--primary"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新增構件</button>
  <button type="button" class="gb-btn"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>檔案</button>
  <button type="button" class="gb-btn gb-btn--quiet">重置視角</button>
  <button type="button" class="gb-btn" aria-pressed="true"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v8a6 6 0 0 0 12 0V4h-4v8a2 2 0 0 1-4 0V4z"/><path d="M6 8h4M14 8h4"/></svg>磁吸</button>
  <button type="button" class="gb-btn gb-btn--danger"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>刪除</button>
  <button type="button" class="gb-btn" disabled>列印施工單</button>
  <span class="gb-dense" style="display:inline-flex;gap:8px"><button type="button" class="gb-btn gb-btn--primary">確認尺寸</button><button type="button" class="gb-btn">貼左面</button></span>
</body>
</html>
