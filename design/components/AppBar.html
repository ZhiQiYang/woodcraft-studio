<!doctype html>
<html lang="zh-Hant">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../gongban.css"><meta charset="utf-8"><title>AppBar — preview</title></head>
<body class="gb gb-preview gb-preview--col" style="padding:0;gap:16px">
  <header class="gb-appbar">
    <a class="gb-appbar__home" href="/" aria-label="回正經工班工作工具"><span class="gb-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span></a>
    <div class="gb-appbar__titles"><span class="gb-appbar__tool">木工設計</span><button type="button" class="gb-appbar__project" aria-label="專案名稱:60×60 正方形木框,點一下改名">60×60 正方形木框</button></div>
    <span class="gb-status" role="status" style="margin-right:8px">已儲存</span>
    <div class="gb-appbar__center gb-dense"><div class="gb-seg" role="group" aria-label="檢視切換"><button type="button" class="gb-seg__item" aria-pressed="true">3D 組裝</button><button type="button" class="gb-seg__item" aria-pressed="false">設計圖紙</button><button type="button" class="gb-seg__item" aria-pressed="false">圖紙+3D</button></div></div>
    <div class="gb-appbar__actions" style="margin-left:8px">
      <button type="button" class="gb-iconbtn" aria-label="復原"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button type="button" class="gb-iconbtn" aria-label="重做"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button type="button" class="gb-iconbtn gb-iconbtn--outline" aria-label="檔案選單"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </header>
  <header class="gb-appbar" style="width:390px">
    <a class="gb-appbar__home" href="/" aria-label="回正經工班工作工具"><span class="gb-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span></a>
    <div class="gb-appbar__titles"><span class="gb-appbar__tool">房間模擬器</span><button type="button" class="gb-appbar__project" aria-label="專案名稱:我的第一個空間,點一下改名">我的第一個空間</button></div>
    <span class="gb-status" role="status" style="margin-right:4px">已儲存</span>
    <div class="gb-appbar__actions">
      <button type="button" class="gb-iconbtn" aria-label="復原"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button type="button" class="gb-iconbtn gb-iconbtn--outline" aria-label="檔案選單"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </header>
</body>
</html>
