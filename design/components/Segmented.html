<!doctype html>
<html lang="zh-Hant">
<head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../gongban.css"><meta charset="utf-8"><title>Segmented — preview</title></head>
<body class="gb gb-preview gb-preview--col">
  <div><div class="gb-seg" role="group" aria-label="檢視切換">
    <button type="button" class="gb-seg__item" aria-pressed="true"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>3D 組裝</button>
    <button type="button" class="gb-seg__item" aria-pressed="false"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 10h7v10"/></svg>設計圖紙</button>
    <button type="button" class="gb-seg__item" aria-pressed="false"><svg class="gb-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M12 4v16"/></svg>圖紙+3D</button>
  </div></div>
  <div class="gb-seg gb-seg--block" role="group" aria-label="篩選結構" style="max-width:360px">
    <button type="button" class="gb-seg__item" aria-pressed="true">全部</button>
    <button type="button" class="gb-seg__item" aria-pressed="false">樑柱隔間</button>
    <button type="button" class="gb-seg__item" aria-pressed="false">門窗入口</button>
  </div>
</body>
</html>
